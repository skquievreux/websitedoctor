<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Doctor – Report</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #111; font-size: 10.5pt; line-height: 1.5; }

    /* ── Page breaks ── */
    .page-break { break-before: page; }
    .no-break   { break-inside: avoid; }

    /* ── Cover ── */
    .cover { display: flex; flex-direction: column; min-height: 100vh; padding: 3cm 2.5cm; }
    .cover-logo { font-size: 0.8rem; color: #aaa; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: auto; }
    .cover-title { font-size: 2.8rem; font-weight: 900; color: #111; line-height: 1.1; margin-bottom: 0.5rem; }
    .cover-host  { font-size: 1.1rem; color: #2563eb; margin-bottom: 0.3rem; }
    .cover-desc  { font-size: 0.9rem; color: #666; max-width: 480px; margin-bottom: 2rem; }
    .cover-meta  { font-size: 0.8rem; color: #999; margin-top: auto; }

    /* ── Gauge row on cover ── */
    .cover-gauges { display: flex; gap: 2.5rem; margin: 2rem 0; flex-wrap: wrap; }
    .cg-item { text-align: center; }
    .cg-label { font-size: 0.72rem; color: #777; margin-top: 0.4rem; }

    /* ── Section ── */
    .section { margin-bottom: 1.8rem; }
    .section-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em; color: #999;
      border-bottom: 1px solid #e5e5e5; padding-bottom: 0.3rem; margin-bottom: 0.9rem; font-weight: 600; }

    /* ── Two-col grid ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.9rem; }

    /* ── Cards ── */
    .card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 0.9rem 1.1rem; }
    .card-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: #999; margin-bottom: 0.6rem; font-weight: 600; }

    /* ── Score Tiles ── */
    .score-tiles { display: flex; gap: 0.9rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .score-tile  { flex: 1; min-width: 110px; border: 1px solid #e5e5e5; border-radius: 8px; padding: 0.75rem 1rem; text-align: center; }
    .score-tile .val { font-size: 2rem; font-weight: 900; }
    .score-tile .lbl { font-size: 0.68rem; color: #888; margin-top: 0.1rem; }
    .sg { color: #166534; } .sm { color: #92400e; } .sb { color: #991b1b; }

    /* ── Priority Issues ── */
    .pi-row { display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.45rem 0;
      border-bottom: 1px solid #f5f5f5; font-size: 0.85rem; }
    .pi-row:last-child { border-bottom: none; }
    .pi-badge { font-size: 0.58rem; font-weight: 700; padding: 0.12rem 0.4rem; border-radius: 3px;
      text-transform: uppercase; flex-shrink: 0; margin-top: 0.15rem; white-space: nowrap; }
    .pi-badge.critical { background: #fee2e2; color: #991b1b; }
    .pi-badge.warning  { background: #fef3c7; color: #92400e; }
    .pi-badge.info     { background: #eff6ff; color: #1e40af; }
    .pi-text { flex: 1; color: #222; }
    .pi-note { font-size: 0.72rem; color: #888; margin-top: 0.15rem; }

    /* ── Security ── */
    .sec-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0;
      border-bottom: 1px solid #f5f5f5; font-size: 0.82rem; }
    .sec-row:last-child { border-bottom: none; }
    .sec-val { margin-left: auto; font-size: 0.68rem; color: #888; max-width: 160px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Performance ── */
    .perf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
    .perf-cell { border: 1px solid #e5e5e5; border-radius: 6px; padding: 0.5rem 0.6rem; text-align: center; }
    .perf-cell .pv { font-size: 1.1rem; font-weight: 800; }
    .perf-cell .pl { font-size: 0.62rem; color: #999; margin-top: 0.1rem; }
    .perf-good { color: #166534; } .perf-mid { color: #92400e; } .perf-bad { color: #991b1b; }

    /* ── Stats strip ── */
    .stats-strip { display: flex; gap: 0.9rem; margin-bottom: 1.5rem; }
    .stat-pill { flex: 1; border: 1px solid #e5e5e5; border-radius: 8px; padding: 0.6rem 0.8rem; text-align: center; }
    .stat-pill .sv { font-size: 1.4rem; font-weight: 800; }
    .stat-pill .sl { font-size: 0.65rem; color: #999; margin-top: 0.1rem; }

    /* ── SEO Coverage ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { text-align: left; font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: #999; padding: 0.3rem 0.5rem; border-bottom: 1px solid #ddd; }
    td { padding: 0.28rem 0.5rem; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .bar-wrap { height: 5px; background: #f0f0f0; border-radius: 3px; min-width: 60px; }
    .bar-fill { height: 100%; border-radius: 3px; }
    .bar-cell { display: flex; align-items: center; gap: 0.4rem; }
    .pct-text { font-size: 0.68rem; color: #999; width: 30px; text-align: right; flex-shrink: 0; }
    .cnt-badge { font-size: 0.65rem; padding: 0.1rem 0.3rem; border-radius: 3px; }
    .w-badge { font-size: 0.6rem; padding: 0.1rem 0.25rem; border-radius: 3px;
      background: #eff6ff; color: #1e40af; }

    /* ── Pages table ── */
    .pages-table td:nth-child(2) { color: #166534; font-weight: 600; }
    .pages-table td.err { color: #991b1b !important; }
    .pages-table .type-badge { font-size: 0.62rem; padding: 0.1rem 0.3rem; border-radius: 3px;
      background: #f5f5f5; color: #666; }
    .pages-table td { font-size: 0.78rem; }

    /* ── SEO details ── */
    .seo-page-block { margin-bottom: 0.9rem; padding-bottom: 0.9rem; border-bottom: 1px solid #f0f0f0; }
    .seo-page-block:last-child { border-bottom: none; }
    .seo-page-url { font-size: 0.78rem; color: #2563eb; margin-bottom: 0.4rem; font-weight: 600; }
    .seo-check { display: flex; align-items: flex-start; gap: 0.4rem; font-size: 0.8rem; padding: 0.15rem 0; }
    .seo-hint { font-size: 0.72rem; color: #999; margin-left: 1.2rem; font-style: italic; }
    .seo-suggestion { font-size: 0.72rem; color: #92400e; margin-left: 1.2rem; }
    .seo-skip { font-size: 0.76rem; color: #bbb; }

    /* ── Strengths / Weaknesses ── */
    .sw-list { list-style: none; }
    .sw-list li { display: flex; gap: 0.4rem; padding: 0.2rem 0; font-size: 0.85rem; }
    .dot-g { color: #166534; } .dot-r { color: #991b1b; } .dot-b { color: #2563eb; }

    /* ── Actions ── */
    .action-list { padding-left: 1.2rem; }
    .action-list li { padding: 0.2rem 0; font-size: 0.85rem; }

    /* ── Footer ── */
    .report-footer { margin-top: 2rem; padding-top: 0.75rem; border-top: 1px solid #eee;
      font-size: 0.68rem; color: #bbb; display: flex; justify-content: space-between; }

    @media print {
      body { font-size: 10pt; }
      .no-break { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="content"><p style="color:#aaa;padding:3rem">Lade Report…</p></div>

<script>
  function sc(n) { return n >= 70 ? 'sg' : n >= 40 ? 'sm' : 'sb' }
  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
  function ms2cls(ms) { return ms > 2000 ? 'perf-bad' : ms > 800 ? 'perf-mid' : 'perf-good' }

  function svgGauge(score, label, size = 80) {
    if (score == null || score === '–') {
      return `<div class="cg-item">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <circle cx="${size/2}" cy="${size/2}" r="${size/2-6}" fill="none" stroke="#e5e5e5" stroke-width="7"/>
          <text x="${size/2}" y="${size/2+5}" text-anchor="middle" fill="#ccc" font-size="14" font-weight="800">–</text>
        </svg>
        <div class="cg-label">${label}</div>
      </div>`
    }
    const n = Number(score)
    const color = n >= 70 ? '#166534' : n >= 40 ? '#92400e' : '#991b1b'
    const bgColor = n >= 70 ? '#dcfce7' : n >= 40 ? '#fef3c7' : '#fee2e2'
    const rad = size / 2 - 6
    const circ = (2 * Math.PI * rad).toFixed(1)
    const offset = (circ * (1 - n / 100)).toFixed(1)
    return `<div class="cg-item">
      <div style="position:relative;width:${size}px;height:${size}px">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
          <circle cx="${size/2}" cy="${size/2}" r="${rad}" fill="${bgColor}" stroke="#e5e5e5" stroke-width="7"/>
          <circle cx="${size/2}" cy="${size/2}" r="${rad}" fill="none" stroke="${color}" stroke-width="7"
            stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
          <span style="font-size:1.25rem;font-weight:900;color:${color}">${n}</span>
        </div>
      </div>
      <div class="cg-label">${label}</div>
    </div>`
  }

  const params = new URLSearchParams(location.search)
  const showScreenshots = params.get('screenshots') === '1'

  async function load() {
    const id = location.pathname.split('/').pop()
    const res = await fetch(`/report/${id}`)
    if (!res.ok) { document.getElementById('content').textContent = 'Report nicht gefunden.'; return }
    render(await res.json())
  }

  function getChecks(p) { return p.checks || p.issues || [] }

  function render(r) {
    const date = new Date(r.timestamp).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })
    const seoScore    = r.seo?.score ?? '–'
    const mobileScore = r.mobile?.score ?? '–'
    const secScore    = r.security?.score ?? '–'

    // ── Cover ──────────────────────────────────────────────────────────
    const cover = `<div class="cover">
      <div class="cover-logo">🩺 Website Doctor</div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <div class="cover-title">${esc(r.siteTitle || r.hostname)}</div>
        <div class="cover-host"><a href="${esc(r.url)}">${esc(r.url)}</a></div>
        ${r.siteDescription ? `<div class="cover-desc">${esc(r.siteDescription)}</div>` : ''}

        <div class="cover-gauges">
          ${svgGauge(r.score,       'Gesamt-Score',   90)}
          ${svgGauge(seoScore,      'SEO-Score',      90)}
          ${svgGauge(r.geo?.score ?? '–', 'GEO / AI', 90)}
          ${svgGauge(mobileScore,   'Mobile-Score',   90)}
          ${svgGauge(secScore,      'Security-Score', 90)}
        </div>

        <div class="stats-strip">
          ${(() => {
            const broken = r.pages.filter(p => p.statusCode !== 200).length
            const jsErr  = r.pages.filter(p => p.jsErrors?.some(e => e.firstParty)).length
            const avgL   = Math.round(r.pages.reduce((s,p)=>s+(p.loadTime??0),0)/(r.pages.length||1))
            const ok     = r.pages.filter(p => p.statusCode === 200).length
            return `
              <div class="stat-pill"><div class="sv ${broken>0?'sb':'sg'}">${broken}</div><div class="sl">Broken Pages</div></div>
              <div class="stat-pill"><div class="sv ${jsErr>0?'sb':'sg'}">${jsErr}</div><div class="sl">JS-Fehler-Seiten</div></div>
              <div class="stat-pill"><div class="sv ${avgL>3000?'sb':avgL>1500?'sm':'sg'}">${avgL}ms</div><div class="sl">Ø Ladezeit</div></div>
              <div class="stat-pill"><div class="sv">${ok}</div><div class="sl">OK-Seiten</div></div>
              <div class="stat-pill"><div class="sv">${r.pageCount}</div><div class="sl">Gecrawlt</div></div>`
          })()}
        </div>
      </div>
      <div class="cover-meta">Erstellt: ${date} &nbsp;·&nbsp; Website Doctor v2</div>
    </div>`

    // ── Seite 2: Prioritäts-Probleme + Security + Performance ─────────
    const priorityIssues = r.priorityIssues?.length
      ? r.priorityIssues.map(i => {
          const lbl = { critical: 'Kritisch', warning: 'Warnung', info: 'Info' }[i.severity] ?? i.severity
          return `<div class="pi-row no-break">
            <span class="pi-badge ${i.severity}">${lbl}</span>
            <div class="pi-text">${esc(i.label)}${i.note ? `<div class="pi-note">${esc(i.note)}</div>` : ''}</div>
          </div>`
        }).join('')
      : '<p style="color:#aaa;font-size:0.85rem">Keine kritischen Probleme gefunden.</p>'

    const secChecks = (r.security?.checks ?? []).map(c => {
      const keyMap = { hsts:'hsts', xFrameOptions:'xFrameOptions', xContentTypeOptions:'xContentTypeOptions', csp:'csp', referrerPolicy:'referrerPolicy', cacheControl:'cacheControl' }
      const val = r.pages[0]?.responseHeaders?.[c.key]
      return `<div class="sec-row">
        <span>${c.pass ? '✅' : '❌'}</span>
        <span>${esc(c.label)}</span>
        ${c.pass && val ? `<span class="sec-val" title="${esc(val)}">${esc(val.slice(0,35))}${val.length>35?'…':''}</span>` : ''}
      </div>`
    }).join('')

    let perfHtml = '<p style="color:#aaa;font-size:0.82rem">Keine Timing-Daten.</p>'
    if (r.performanceSummary) {
      const ps = r.performanceSummary
      perfHtml = `<div class="perf-grid">
        <div class="perf-cell"><div class="pv ${ms2cls(ps.avgTtfb)}">${ps.avgTtfb}ms</div><div class="pl">Ø TTFB</div></div>
        <div class="perf-cell"><div class="pv ${ms2cls(ps.avgDomReady)}">${ps.avgDomReady}ms</div><div class="pl">Ø DOM ready</div></div>
        <div class="perf-cell"><div class="pv ${ms2cls(ps.avgFullyLoaded)}">${ps.avgFullyLoaded}ms</div><div class="pl">Ø Fully Loaded</div></div>
        <div class="perf-cell"><div class="pv ${ms2cls(ps.p75Ttfb)}">${ps.p75Ttfb}ms</div><div class="pl">P75 TTFB</div></div>
        <div class="perf-cell"><div class="pv ${ms2cls(ps.p75FullyLoaded)}">${ps.p75FullyLoaded}ms</div><div class="pl">P75 Loaded</div></div>
        <div class="perf-cell"><div class="pv ${ps.slowPages>0?'perf-bad':'perf-good'}">${ps.slowPages}</div><div class="pl">Seiten &gt;3s</div></div>
      </div>`
    }

    const techHints = r.techHints?.length
      ? r.techHints.map(t => {
          const col = t.severity === 'critical' ? '#991b1b' : t.severity === 'warning' ? '#92400e' : '#1e40af'
          return `<div style="padding:0.35rem 0;border-bottom:1px solid #f5f5f5;font-size:0.83rem">
            <span style="color:${col};font-weight:600">${esc(t.label)}</span>
            <div style="font-size:0.72rem;color:#888;margin-top:0.1rem">${esc(t.note)}</div>
          </div>`
        }).join('')
      : ''

    const page2 = `<div class="page-break" style="padding:2cm 2.5cm">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:0.5rem;border-bottom:2px solid #111">
        <div style="font-weight:900;font-size:1rem">${esc(r.siteTitle || r.hostname)}</div>
        <div style="font-size:0.72rem;color:#aaa">${date}</div>
      </div>

      <div class="section no-break">
        <div class="section-title">Prioritäts-Probleme</div>
        ${priorityIssues}
      </div>

      ${r.topDeviations?.length ? `<div class="section no-break">
        <div class="section-title">Auffälligste Seiten (Screenshots)</div>
        <div style="display:grid;grid-template-columns:repeat(${Math.min(r.topDeviations.length, 3)},1fr);gap:0.8rem;margin-top:0.5rem">
          ${r.topDeviations.map(d => `<div style="border:1px solid #e5e7eb;border-radius:6px;overflow:hidden">
            <img src="/${d.screenshotPath}" style="width:100%;height:140px;object-fit:cover;object-position:top;display:block" alt="">
            <div style="padding:0.4rem 0.5rem;font-size:0.72rem">
              <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.title || d.url)}</div>
              <div style="color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.url)}</div>
              <div style="margin-top:0.2rem;color:#991b1b;font-size:0.68rem">${d.reasons.join(' · ')}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>` : ''}

      <div class="two-col" style="margin-bottom:1.5rem">
        <div class="section no-break">
          <div class="section-title">Security-Header</div>
          ${secChecks || '<p style="color:#aaa">Keine Daten.</p>'}
        </div>
        <div class="section no-break">
          <div class="section-title">Performance-Metriken</div>
          ${perfHtml}
        </div>
      </div>

      ${techHints ? `<div class="section no-break"><div class="section-title">Technische Hinweise</div>${techHints}</div>` : ''}

      <div class="section no-break">
        <div class="section-title">Stärken &amp; Schwächen</div>
        <div class="two-col">
          <div>
            <div style="font-size:0.72rem;color:#166534;font-weight:600;margin-bottom:0.4rem">✓ Stärken</div>
            <ul class="sw-list">${r.strengths.map(s=>`<li><span class="dot-g">✓</span>${esc(s)}</li>`).join('')||'<li style="color:#aaa">–</li>'}</ul>
          </div>
          <div>
            <div style="font-size:0.72rem;color:#991b1b;font-weight:600;margin-bottom:0.4rem">✗ Schwächen</div>
            <ul class="sw-list">${r.weaknesses.map(w=>`<li><span class="dot-r">✗</span>${esc(w)}</li>`).join('')||'<li style="color:#aaa">–</li>'}</ul>
          </div>
        </div>
      </div>

      <div class="section no-break">
        <div class="section-title">Empfohlene Maßnahmen</div>
        <ol class="action-list">${r.actions.map(a=>`<li>${esc(a)}</li>`).join('')||'<li style="color:#aaa">Keine Maßnahmen</li>'}</ol>
      </div>
    </div>`

    // ── Seite 3: SEO Coverage Matrix + Details ─────────────────────────
    let seoPage = ''
    if (r.seo?.pages?.length) {
      const allPages = r.seo.pages
      const checkIds = [...new Set(allPages.flatMap(p => getChecks(p).map(c => c.id)))]
      const coverageRows = checkIds.map(id => {
        const all = allPages.flatMap(p => getChecks(p).filter(c => c.id === id && !c.skipped))
        if (!all.length) return ''
        const pass = all.filter(c => c.pass).length
        const pct = Math.round((pass / all.length) * 100)
        const fillColor = pct === 100 ? '#166534' : pct >= 60 ? '#92400e' : '#991b1b'
        const label = all[0].label.replace(/\(.*?\)/g, '').trim()
        const weight = all[0].weight ?? ''
        const cntColor = pass < all.length ? '#fee2e2' : '#dcfce7'
        const cntTxt   = pass < all.length ? '#991b1b' : '#166534'
        return `<tr>
          <td>${esc(label)}</td>
          <td><div class="bar-cell">
            <div class="bar-wrap" style="min-width:80px"><div class="bar-fill" style="width:${pct}%;background:${fillColor}"></div></div>
            <span class="pct-text">${pct}%</span>
          </div></td>
          <td style="text-align:center"><span class="cnt-badge" style="background:${cntColor};color:${cntTxt}">${pass}/${all.length}</span></td>
          <td style="text-align:right"><span class="w-badge">[${weight}]</span></td>
        </tr>`
      }).join('')

      // SEO details (only failed checks shown)
      const seoDetails = allPages.map(p => {
        const checks = getChecks(p)
        const failed = checks.filter(c => !c.pass && !c.skipped)
        if (!failed.length) return ''
        const items = failed.map(i =>
          `<div class="seo-check">
            <span>⚠️</span>
            <div>
              <span>${esc(i.label)}</span>
              ${i.value != null ? `<div class="seo-hint">${esc(String(i.value))}</div>` : ''}
              ${i.suggestion ? `<div class="seo-suggestion">→ ${esc(i.suggestion)}</div>` : ''}
            </div>
          </div>`
        ).join('')
        return `<div class="seo-page-block no-break">
          <div class="seo-page-url">${esc(p.url)}</div>
          ${items}
        </div>`
      }).join('')

      const passTotal = allPages.flatMap(p => getChecks(p).filter(c=>c.pass&&!c.skipped)).length
      const failTotal = allPages.flatMap(p => getChecks(p).filter(c=>!c.pass&&!c.skipped)).length

      seoPage = `<div class="page-break" style="padding:2cm 2.5cm">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:0.5rem;border-bottom:2px solid #111">
          <div style="font-weight:900;font-size:1rem">${esc(r.siteTitle || r.hostname)}</div>
          <div style="font-size:0.72rem;color:#aaa">SEO-Analyse</div>
        </div>

        <div class="section no-break">
          <div class="section-title">SEO-Score ${r.seo.score}/100 &nbsp;·&nbsp; ${allPages.length} Seiten &nbsp;·&nbsp; ${passTotal} bestanden &nbsp;·&nbsp; ${failTotal} fehlgeschlagen</div>
          <table>
            <thead><tr><th>Check</th><th>Bestanden</th><th>Seiten</th><th>Gew.</th></tr></thead>
            <tbody>${coverageRows}</tbody>
          </table>
        </div>

        ${seoDetails ? `<div class="section"><div class="section-title">Fehlgeschlagene Checks im Detail</div>${seoDetails}</div>` : ''}
      </div>`
    }

    // ── Seite GEO: GEO / AI-Readiness ────────────────────────────────────
    let geoPage = ''
    if (r.geo) {
      const g = r.geo
      const scored     = (g.checks || []).filter(c => c.weight > 0)
      const infoChecks = (g.checks || []).filter(c => c.informational)

      // Kern-Checks Tabelle
      const coreRows = scored.map(c => {
        const catColor = { A:'#3730a3', B:'#065f46', C:'#92400e', D:'#1e3a8a', E:'#4c1d95' }[c.category] || '#666'
        const catBg    = { A:'#eff6ff', B:'#ecfdf5', C:'#fef3c7', D:'#dbeafe', E:'#ede9fe' }[c.category] || '#f5f5f5'
        return `<tr class="no-break">
          <td><span style="font-size:0.58rem;font-weight:700;padding:0.1rem 0.3rem;border-radius:3px;background:${catBg};color:${catColor}">${c.category}</span></td>
          <td style="font-size:0.8rem">${esc(c.label)}</td>
          <td style="text-align:center;font-weight:700;color:${c.pass?'#166534':'#991b1b'}">${c.pass?'✓':'✗'}</td>
          <td style="text-align:right"><span class="w-badge">[${c.weight}]</span></td>
          <td style="font-size:0.7rem;color:#92400e;max-width:180px">${c.pass ? '' : esc((c.suggestion||'').slice(0,100))}</td>
        </tr>`
      }).join('')

      // AI-Bot Details
      const botCheck  = (g.checks || []).find(c => c.id === 'ai-bots-allowed')
      const botRows = (botCheck?.detail || []).map(b =>
        `<tr>
          <td style="font-weight:600;font-size:0.8rem">${esc(b.name)}</td>
          <td style="font-size:0.75rem;color:#777">${esc(b.owner)}</td>
          <td style="font-size:0.72rem;font-weight:600;color:${b.pass?'#166534':'#991b1b'}">${esc(b.status)}</td>
        </tr>`
      ).join('')

      // Informelle Checks
      const infoRows = infoChecks.filter(c => c.id !== 'schema-classification').map(c =>
        `<div style="display:flex;gap:0.5rem;padding:0.25rem 0;border-bottom:1px solid #f5f5f5;font-size:0.8rem">
          <span style="color:${c.pass?'#166534':'#92400e'}">${c.pass?'✓':'!'}</span>
          <div>
            <span>${esc(c.label)}</span>
            ${c.suggestion ? `<div style="font-size:0.7rem;color:#aaa;margin-top:0.1rem">${esc(c.suggestion.slice(0,120))}</div>` : ''}
          </div>
        </div>`
      ).join('')

      // AI-Dateien
      const aiFiles = [
        { label: '/ai.txt',   obj: g.aiTxt   },
        { label: '/llms.txt', obj: g.llmsTxt },
      ].map(f => `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.2rem 0;font-size:0.8rem">
        <span style="color:${f.obj?.exists?'#166534':'#999'}">${f.obj?.exists?'✓':'✗'}</span>
        <span style="font-weight:600">${f.label}</span>
        <span style="color:#aaa;font-size:0.72rem">${f.obj?.exists?'vorhanden':'fehlt'}</span>
      </div>`).join('')

      // Schema-Klassifizierung
      const schemaCl = (g.checks||[]).find(c=>c.id==='schema-classification')
      const schemaSection = schemaCl ? `
        <div class="section no-break">
          <div class="section-title">Schema-Typ-Klassifizierung (E-4)</div>
          ${schemaCl.detail?.specific?.length ? `<div style="font-size:0.8rem;color:#166534;margin-bottom:0.3rem">✓ Spezifisch: ${schemaCl.detail.specific.join(', ')}</div>` : ''}
          ${schemaCl.detail?.generic?.length  ? `<div style="font-size:0.8rem;color:#92400e">⚠ Generisch: ${schemaCl.detail.generic.join(', ')}</div>` : ''}
          ${!schemaCl.pass && schemaCl.suggestion ? `<div style="font-size:0.75rem;color:#aaa;margin-top:0.3rem">→ ${esc(schemaCl.suggestion)}</div>` : ''}
        </div>` : ''

      // LLM Snippet-Previews
      const snippetSection = g.snippetPreviews?.length ? `
        <div class="section no-break">
          <div class="section-title">LLM Snippet-Previews</div>
          ${g.snippetPreviews.map(s=>`
            <div style="margin-bottom:0.6rem;padding:0.5rem 0.7rem;border:1px solid #e5e5e5;border-left:3px solid #2563eb;border-radius:5px">
              <div style="font-size:0.65rem;color:#aaa;margin-bottom:0.2rem">${esc(s.url)}</div>
              <div style="font-size:0.8rem;color:#333;line-height:1.5">${esc(s.snippet)}</div>
            </div>`).join('')}
        </div>` : ''

      // GEO score interpretation
      const geoInterpretation = g.score >= 80
        ? { color: '#166534', bg: '#f0fdf4', border: '#bbf7d0', icon: '✅', title: 'Sehr gut – KI-Sichtbarkeit optimiert', text: 'Die Website ist gut auf KI-Suchmaschinen wie ChatGPT Search, Perplexity und Claude vorbereitet. Strukturierte Daten, Entity-Links und AI-Bot-Zugang sind vorhanden.' }
        : g.score >= 60
        ? { color: '#92400e', bg: '#fffbeb', border: '#fde68a', icon: '⚠', title: 'Ausbaufähig – einzelne Lücken vorhanden', text: 'Grundlegende GEO-Faktoren sind erfüllt, aber es fehlen wichtige Elemente für maximale KI-Sichtbarkeit. Fehlende Schema-Typen oder nicht eindeutige Entitätsverlinkungen reduzieren die Chance, in AI-generierten Antworten zitiert zu werden.' }
        : g.score >= 40
        ? { color: '#9a3412', bg: '#fff7ed', border: '#fed7aa', icon: '⚠', title: 'Schwach – erheblicher Nachholbedarf', text: 'Die Website wird von KI-Modellen nur eingeschränkt verstanden. Fehlende strukturierte Daten, keine Entitäts-Verlinkungen und möglicherweise blockierte AI-Bots führen dazu, dass die Site in AI-Antworten kaum oder gar nicht auftaucht.' }
        : { color: '#991b1b', bg: '#fef2f2', border: '#fecaca', icon: '🚫', title: 'Kritisch – kaum KI-Sichtbarkeit', text: 'Die Website ist für KI-Suchmaschinen weitgehend unsichtbar. Ohne strukturierte Daten, eindeutige Entitätsverweise und freigeschaltete AI-Bots wird die Site bei ChatGPT Search, Perplexity und ähnlichen Diensten nicht als relevante Quelle erkannt.' }

      // Priorisierte GEO-Maßnahmen aus fehlgeschlagenen Checks
      const geoActions = scored
        .filter(c => !c.pass && c.suggestion)
        .sort((a, b) => b.weight - a.weight)
        .map((c, i) => `<div style="display:flex;gap:0.6rem;padding:0.4rem 0;border-bottom:1px solid #f0f0f0;font-size:0.8rem">
          <div style="min-width:20px;font-weight:700;color:#991b1b">${i + 1}.</div>
          <div>
            <div style="font-weight:600">${esc(c.label)}</div>
            <div style="color:#555;margin-top:0.15rem">${esc(c.suggestion)}</div>
            <div style="font-size:0.68rem;color:#aaa;margin-top:0.1rem">Gewicht: ${c.weight} Punkte</div>
          </div>
        </div>`).join('')

      geoPage = `<div class="page-break" style="padding:2cm 2.5cm">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:0.5rem;border-bottom:2px solid #111">
          <div style="font-weight:900;font-size:1rem">${esc(r.siteTitle || r.hostname)}</div>
          <div style="font-size:0.72rem;color:#aaa">GEO / AI-Readiness</div>
        </div>

        <div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:1.2rem;flex-wrap:wrap">
          <div style="display:flex;flex-direction:column;align-items:center">
            ${svgGauge(g.score, 'GEO-Score', 80)}
            ${g.score < 50 ? `<div style="margin-top:4px;padding:2px 6px;background:#fee2e2;color:#991b1b;border-radius:3px;font-size:0.65rem;font-weight:700">⚠ Kritisch</div>` : ''}
          </div>
          <div>
            <div style="font-size:0.8rem;color:#777;margin-bottom:0.25rem">Generative Engine Optimization – Sichtbarkeit in ChatGPT, Perplexity, Claude</div>
            <div style="font-size:0.82rem">
              <span style="color:#166534">${scored.filter(c=>c.pass).length} bestanden</span> /
              <span style="color:#991b1b">${scored.filter(c=>!c.pass).length} fehlgeschlagen</span>
              &nbsp;·&nbsp; ${scored.length} Kern-Checks &nbsp;·&nbsp; ${infoChecks.length} informell
            </div>
          </div>
        </div>

        <div style="padding:0.8rem 1rem;background:${geoInterpretation.bg};border:1px solid ${geoInterpretation.border};border-left:4px solid ${geoInterpretation.color};border-radius:6px;margin-bottom:1.2rem">
          <div style="font-weight:700;color:${geoInterpretation.color};font-size:0.85rem;margin-bottom:0.3rem">${geoInterpretation.icon} ${geoInterpretation.title}</div>
          <div style="font-size:0.78rem;color:#444;line-height:1.5">${geoInterpretation.text}</div>
        </div>

        <div class="section no-break">
          <div class="section-title">Kern-Checks (Score-relevant)</div>
          <table>
            <thead><tr><th>Kat.</th><th>Check</th><th>Status</th><th>Gew.</th><th>Empfehlung</th></tr></thead>
            <tbody>${coreRows}</tbody>
          </table>
        </div>

        ${botRows ? `<div class="section no-break">
          <div class="section-title">AI-Bot Zugang (robots.txt)</div>
          <table><thead><tr><th>Bot</th><th>Plattform</th><th>Status</th></tr></thead>
          <tbody>${botRows}</tbody></table>
        </div>` : ''}

        <div class="two-col" style="margin-bottom:1.2rem">
          <div class="section no-break">
            <div class="section-title">AI-Dateien (/ai.txt &amp; /llms.txt)</div>
            ${aiFiles}
          </div>
          <div class="section no-break">
            <div class="section-title">Informelle Checks</div>
            ${infoRows || '<p style="font-size:0.8rem;color:#aaa">–</p>'}
          </div>
        </div>

        ${schemaSection}
        ${snippetSection}

        ${geoActions ? `<div class="section no-break">
          <div class="section-title">Empfohlene GEO-Maßnahmen (nach Priorität)</div>
          ${geoActions}
        </div>` : '<div class="section no-break"><div class="section-title">Empfohlene GEO-Maßnahmen</div><p style="font-size:0.82rem;color:#166534">✓ Alle Score-relevanten GEO-Checks bestanden – keine Maßnahmen erforderlich.</p></div>'}
      </div>`
    }

    // ── Seite 4: Gecrawlte Seiten ──────────────────────────────────────
    const pageRows = r.pages.map(p => {
      const ok = p.statusCode === 200
      const jsCount = p.jsErrors?.filter(e => e.firstParty).length ?? 0
      const loadCls = p.loadTime > 3000 ? 'perf-bad' : p.loadTime > 1500 ? 'perf-mid' : 'perf-good'
      const timing = p.timing
        ? `TTFB: ${p.timing.ttfb}ms / DOM: ${p.timing.domReady}ms / Load: ${p.timing.fullyLoaded}ms`
        : ''
      return `<tr class="pages-table">
        <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.75rem">
          <a href="${esc(p.url)}" style="color:#2563eb">${esc(p.url)}</a>
        </td>
        <td class="${ok ? '' : 'err'}">${p.statusCode ?? '?'}</td>
        <td><span class="type-badge">${esc(p.type ?? '–')}</span></td>
        <td class="${loadCls}" style="white-space:nowrap">${p.loadTime ? p.loadTime+'ms' : '–'}</td>
        <td style="${jsCount>0?'color:#991b1b;font-weight:600':''}">${jsCount > 0 ? jsCount+' ⚠' : '–'}</td>
        <td style="font-size:0.68rem;color:#aaa;white-space:nowrap">${timing}</td>
      </tr>`
    }).join('')

    const pagesPage = `<div class="page-break" style="padding:2cm 2.5cm">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:0.5rem;border-bottom:2px solid #111">
        <div style="font-weight:900;font-size:1rem">${esc(r.siteTitle || r.hostname)}</div>
        <div style="font-size:0.72rem;color:#aaa">Gecrawlte Seiten</div>
      </div>
      <div class="section">
        <div class="section-title">${r.pageCount} Seiten gecrawlt</div>
        <table class="pages-table">
          <thead><tr><th>URL</th><th>Status</th><th>Typ</th><th>Ladezeit</th><th>JS-Fehler</th><th>Timing</th></tr></thead>
          <tbody>${pageRows}</tbody>
        </table>
      </div>
      <div class="report-footer">
        <span>🩺 Website Doctor &nbsp;·&nbsp; ${esc(r.url)}</span>
        <span>${date}</span>
      </div>
    </div>`

    document.getElementById('content').innerHTML = cover + page2 + seoPage + geoPage + pagesPage
    document.title = `Website Doctor – ${esc(r.siteTitle || r.hostname || r.url)}`
  }

  load()
</script>
</body>
</html>
