<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Doctor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f11; color: #e1e1e6; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ── */
    header { padding: 1rem 1.5rem; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
    header h1 { font-size: 1.2rem; font-weight: 700; color: #fff; white-space: nowrap; }
    .version-badge { font-size: 0.65rem; color: #444; margin-left: 0.5rem; font-weight: 400; }
    .input-row { display: flex; gap: 0.5rem; flex: 1; }
    .input-row input { flex: 1; padding: 0.6rem 0.9rem; border-radius: 7px; border: 1px solid #333; background: #1a1a1f; color: #e1e1e6; font-size: 0.95rem; outline: none; }
    .input-row input:focus { border-color: #6c6cff; }
    .input-row button { padding: 0.6rem 1.2rem; border-radius: 7px; border: none; background: #6c6cff; color: #fff; font-size: 0.95rem; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .input-row button:hover { background: #5a5ae0; }
    .input-row button:disabled { background: #444; cursor: not-allowed; }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    aside { width: 240px; border-right: 1px solid #222; overflow-y: auto; flex-shrink: 0; }
    aside .sidebar-head { padding: 0.75rem 1rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #555; border-bottom: 1px solid #1a1a1a; }
    .history-item { padding: 0.75rem 1rem; border-bottom: 1px solid #1a1a1a; cursor: pointer; transition: background 0.15s; }
    .history-item:hover { background: #1a1a1f; }
    .history-item.active { background: #1e1e2e; border-left: 2px solid #6c6cff; }
    .history-item .h-url { font-size: 0.8rem; font-weight: 600; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item .h-date { font-size: 0.7rem; color: #666; margin-top: 0.2rem; }
    .history-item .h-badges { display: flex; gap: 0.35rem; margin-top: 0.35rem; align-items: center; }
    .h-score { font-size: 0.68rem; padding: 0.15rem 0.4rem; border-radius: 3px; font-weight: 700; }
    .h-score.good { background: #14532d; color: #4ade80; }
    .h-score.mid  { background: #422006; color: #fb923c; }
    .h-score.bad  { background: #450a0a; color: #f87171; }
    .h-pages { font-size: 0.68rem; padding: 0.15rem 0.4rem; border-radius: 3px; background: #1e1b4b; color: #a5b4fc; }
    .h-rerun { margin-left: auto; padding: 0.1rem 0.35rem; background: none; border: 1px solid #2a2a2f; border-radius: 3px; color: #555; font-size: 0.75rem; cursor: pointer; line-height: 1; transition: all 0.15s; flex-shrink: 0; }
    .h-rerun:hover { border-color: #6c6cff; color: #a5b4fc; }
    aside .empty { padding: 1rem; font-size: 0.8rem; color: #555; text-align: center; }

    /* ── Main ── */
    main { flex: 1; overflow-y: auto; padding: 1.5rem; }

    /* ── Status ── */
    #status-box { padding: 1rem 1.25rem; border-radius: 8px; background: #1a1a1f; border: 1px solid #333; display: none; margin-bottom: 1.5rem; }
    #status-box .label { font-size: 0.8rem; color: #888; margin-bottom: 0.5rem; }
    #progress-bar-wrap { background: #2a2a2f; border-radius: 4px; height: 6px; overflow: hidden; }
    #progress-bar { height: 100%; background: #6c6cff; width: 0; transition: width 0.3s; }
    #status-text { margin-top: 0.5rem; font-size: 0.85rem; color: #aaa; }
    #error-box { padding: 1rem 1.25rem; border-radius: 8px; background: #1a0a0a; border: 1px solid #450a0a; color: #f87171; display: none; margin-bottom: 1.5rem; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0.25rem; margin-bottom: 1.5rem; border-bottom: 1px solid #222; padding-bottom: 0; }
    .tab-btn { padding: 0.5rem 1rem; background: none; border: none; color: #666; cursor: pointer; font-size: 0.9rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab-btn.active { color: #fff; border-bottom-color: #6c6cff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Site-Header Card ── */
    .site-header-card { background: #1a1a1f; border: 1px solid #333; border-radius: 10px; padding: 1.1rem 1.25rem; margin-bottom: 1.25rem; }
    .site-header-card .sh-title { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    .site-header-card .sh-url { font-size: 0.82rem; color: #6c6cff; text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem; }
    .site-header-card .sh-url:hover { text-decoration: underline; color: #8a8aff; }
    .site-header-card .sh-desc { font-size: 0.82rem; color: #888; margin-top: 0.5rem; line-height: 1.5; }

    /* ── Score cards ── */
    .scores-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .score-card { flex: 1; min-width: 140px; text-align: center; padding: 1.25rem; background: #1a1a1f; border-radius: 10px; border: 1px solid #333; }
    .score-card .val { font-size: 2.8rem; font-weight: 800; }
    .score-card .lbl { color: #888; font-size: 0.8rem; margin-top: 0.2rem; }
    .score-good { color: #4ade80; } .score-mid { color: #fb923c; } .score-bad { color: #f87171; }

    /* ── Cards ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }
    .card { background: #1a1a1f; border: 1px solid #333; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
    .card h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #666; margin-bottom: 0.75rem; }
    .card ul { list-style: none; }
    .card ul li { padding: 0.3rem 0; font-size: 0.88rem; display: flex; gap: 0.5rem; align-items: flex-start; }
    .dot-green { color: #4ade80; } .dot-red { color: #f87171; } .dot-blue { color: #60a5fa; }

    /* ── Pages grid ── */
    .pages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .page-card { background: #1a1a1f; border: 1px solid #333; border-radius: 10px; overflow: hidden; }
    .page-card .thumb-wrap { position: relative; height: 130px; overflow: hidden; background: #111; cursor: zoom-in; }
    .page-card .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: opacity 0.2s; }
    .page-card .thumb-wrap:hover img { opacity: 0.85; }
    .page-card .thumb-wrap .zoom-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; font-size: 1.5rem; transition: opacity 0.2s; }
    .page-card .thumb-wrap:hover .zoom-hint { opacity: 1; }
    .page-card .no-img { height: 130px; display: flex; align-items: center; justify-content: center; color: #333; font-size: 0.75rem; background: #111; }
    .page-card .pi { padding: 0.7rem; }
    .page-card .pi-type { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: #666; }
    .page-card .pi-title { font-size: 0.82rem; font-weight: 600; margin: 0.15rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-card .pi-url a { font-size: 0.72rem; color: #6c6cff; text-decoration: none; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-card .pi-url a:hover { text-decoration: underline; }
    .deviations-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .deviation-card { background: #1a1a1f; border: 1px solid #4b1515; border-radius: 10px; overflow: hidden; }
    .deviation-card .dev-img { position: relative; height: 160px; overflow: hidden; background: #111; cursor: zoom-in; }
    .deviation-card .dev-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: opacity 0.2s; }
    .deviation-card .dev-img:hover img { opacity: 0.85; }
    .deviation-card .dev-img-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; font-size: 1.4rem; transition: opacity 0.2s; }
    .deviation-card .dev-img:hover .dev-img-hint { opacity: 1; }
    .deviation-card .dev-info { padding: 0.7rem; }
    .deviation-card .dev-title { font-size: 0.82rem; font-weight: 600; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .deviation-card .dev-url a { font-size: 0.72rem; color: #6c6cff; text-decoration: none; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .deviation-card .dev-url a:hover { text-decoration: underline; }
    .deviation-card .dev-badges { margin-top: 0.4rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .page-card .pi-meta { display: flex; gap: 0.35rem; margin-top: 0.4rem; flex-wrap: wrap; }
    .badge { font-size: 0.68rem; padding: 0.15rem 0.4rem; border-radius: 3px; font-weight: 600; }
    .b-ok { background: #14532d; color: #4ade80; } .b-err { background: #450a0a; color: #f87171; }
    .b-ms { background: #1e1b4b; color: #a5b4fc; } .b-warn { background: #422006; color: #fb923c; }

    /* ── Timing bars ── */
    .timing-bars { margin-top: 0.45rem; }
    .t-row { display: flex; align-items: center; gap: 0.3rem; font-size: 0.64rem; color: #777; margin-bottom: 0.12rem; }
    .t-row .t-label { width: 42px; flex-shrink: 0; }
    .t-row .t-ms { width: 38px; text-align: right; flex-shrink: 0; }
    .t-bar-wrap { flex: 1; background: #2a2a2f; border-radius: 2px; height: 4px; overflow: hidden; }
    .t-bar { height: 100%; background: #6c6cff; border-radius: 2px; }
    .t-bar.slow { background: #fb923c; }
    .t-bar.bad  { background: #f87171; }

    /* ── SEO issue list ── */
    .seo-page { margin-bottom: 0.75rem; padding: 0.75rem 1rem; background: #151518; border-radius: 8px; border: 1px solid #222; display: flex; gap: 1rem; align-items: flex-start; }
    .seo-thumb-wrap { flex-shrink: 0; width: 90px; }
    .seo-thumb { width: 90px; border-radius: 5px; border: 1px solid #333; cursor: zoom-in; display: block; }
    .seo-thumb:hover { border-color: #6c6cff; }
    .seo-checks { flex: 1; min-width: 0; }
    .seo-page-url { font-size: 0.78rem; margin-bottom: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seo-page-url a { color: #6c6cff; text-decoration: none; }
    .seo-page-url a:hover { text-decoration: underline; }
    .seo-issue { font-size: 0.82rem; padding: 0.2rem 0; display: flex; gap: 0.4rem; align-items: flex-start; }
    .seo-issue .icon { flex-shrink: 0; margin-top: 0.05rem; }
    .seo-value { display: block; font-size: 0.74rem; color: #666; font-style: italic; margin-top: 0.15rem; }
    .seo-suggestion { display: block; font-size: 0.74rem; color: #fb923c; font-weight: 600; margin-top: 0.1rem; }
    .seo-js-errors { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #2a2a2a; }
    .seo-js-err { font-size: 0.75rem; color: #f87171; padding: 0.15rem 0; display: flex; gap: 0.35rem; }
    .seo-js-err-type { font-size: 0.65rem; padding: 0.1rem 0.3rem; border-radius: 3px; background: #450a0a; flex-shrink: 0; }

    /* ── Mobile ── */
    .mobile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .mobile-card { background: #1a1a1f; border: 1px solid #333; border-radius: 10px; overflow: hidden; }
    .mobile-card .thumb-wrap { height: 180px; overflow: hidden; cursor: zoom-in; background: #111; position: relative; }
    .mobile-card .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: opacity 0.2s; }
    .mobile-card .thumb-wrap:hover img { opacity: 0.85; }
    .mobile-card .thumb-wrap .zoom-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; font-size: 1.5rem; transition: opacity 0.2s; }
    .mobile-card .thumb-wrap:hover .zoom-hint { opacity: 1; }
    .mobile-card .mi { padding: 0.6rem; }
    .mobile-card .mi-title { font-size: 0.78rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mobile-card .mi-url { font-size: 0.7rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.15rem; }

    /* ── Lightbox ── */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 6px; box-shadow: 0 0 60px rgba(0,0,0,0.8); }
    .lightbox-close { position: absolute; top: 1.25rem; right: 1.5rem; color: #888; font-size: 1.8rem; cursor: pointer; line-height: 1; }
    .lightbox-close:hover { color: #fff; }

    #report { display: none; }
    .welcome { color: #444; text-align: center; margin-top: 4rem; font-size: 0.95rem; line-height: 1.8; }

    /* ── Export-Buttons ── */
    .export-bar { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .btn-export { padding: 0.4rem 0.9rem; border-radius: 6px; border: 1px solid #333; background: #1a1a1f; color: #aaa; font-size: 0.8rem; cursor: pointer; }
    .btn-export:hover { border-color: #6c6cff; color: #fff; }

    /* ── Live Pages During Crawl ── */
    #live-pages { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; max-height: 320px; overflow-y: auto; }
    .live-page-row { display: flex; gap: 0.75rem; align-items: center; background: #111; border-radius: 6px; padding: 0.5rem; border: 1px solid #222; }
    .live-thumb { width: 72px; height: 48px; object-fit: cover; object-position: top; border-radius: 4px; flex-shrink: 0; border: 1px solid #333; }
    .live-thumb-placeholder { width: 72px; height: 48px; background: #1a1a1f; border-radius: 4px; flex-shrink: 0; }
    .live-page-info { flex: 1; min-width: 0; }
    .live-page-title { font-size: 0.78rem; font-weight: 600; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-page-url { font-size: 0.7rem; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.15rem; }
    .live-page-badges { display: flex; gap: 0.3rem; margin-top: 0.3rem; }

    /* ── Print / PDF ── */
    @media print {
      aside, header .input-row, .export-bar, .tabs { display: none !important; }
      body { background: #fff; color: #000; }
      .score-card, .card { border: 1px solid #ccc; background: #fff; }
      .score-good { color: #166534; }
      .score-mid  { color: #92400e; }
      .score-bad  { color: #991b1b; }
      main { overflow: visible; }
      .layout { display: block; }
      .page-card { break-inside: avoid; }
    }

    /* ── SEO-Gewichts-Badge ── */
    .seo-weight { font-size: 0.62rem; padding: 0.1rem 0.3rem; border-radius: 3px; background: #1e1b4b; color: #818cf8; margin-left: 0.3rem; flex-shrink: 0; }
    .seo-skipped { font-size: 0.74rem; color: #555; font-style: italic; }

    /* ── Priority Issues ── */
    .priority-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .priority-item { display: flex; align-items: flex-start; gap: 0.65rem; padding: 0.6rem 0.8rem; border-radius: 7px; font-size: 0.85rem; }
    .priority-item.critical { background: #1a0505; border: 1px solid #5a1010; }
    .priority-item.warning  { background: #1a1005; border: 1px solid #5a3a0a; }
    .priority-item.info     { background: #0a0f1a; border: 1px solid #1e2d4b; }
    .pi-badge { font-size: 0.6rem; font-weight: 700; padding: 0.15rem 0.45rem; border-radius: 3px; text-transform: uppercase; flex-shrink: 0; margin-top: 0.1rem; }
    .pi-badge.critical { background: #450a0a; color: #f87171; }
    .pi-badge.warning  { background: #422006; color: #fb923c; }
    .pi-badge.info     { background: #1e1b4b; color: #818cf8; }
    .pi-text { flex: 1; color: #ddd; }
    .pi-note { font-size: 0.74rem; color: #666; margin-top: 0.2rem; }

    /* ── SVG Gauge ── */
    .gauge-row { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.5rem; }
    .gauge-wrap { text-align: center; }
    .gauge-wrap .g-label { font-size: 0.75rem; color: #666; margin-top: 0.4rem; }
    .gauge-wrap .g-sub { font-size: 0.68rem; color: #444; margin-top: 0.1rem; }

    /* ── Stats Strip ── */
    .stats-strip { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .stat-pill { flex: 1; min-width: 110px; background: #1a1a1f; border: 1px solid #2a2a2f; border-radius: 8px; padding: 0.7rem 0.9rem; }
    .stat-pill .sp-val { font-size: 1.4rem; font-weight: 800; }
    .stat-pill .sp-label { font-size: 0.7rem; color: #555; margin-top: 0.1rem; }

    /* ── Security Card ── */
    .security-checks { display: flex; flex-direction: column; gap: 0.3rem; }
    .sec-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; padding: 0.2rem 0; }
    .sec-val { font-size: 0.72rem; color: #555; margin-left: auto; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

    /* ── Performance Card ── */
    .perf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.6rem; }
    .perf-cell { background: #111; border: 1px solid #222; border-radius: 6px; padding: 0.5rem 0.6rem; }
    .perf-cell .pc-val { font-size: 1.1rem; font-weight: 700; }
    .perf-cell .pc-label { font-size: 0.65rem; color: #555; margin-top: 0.1rem; }

    /* ── SEO Coverage Matrix ── */
    .seo-coverage { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .seo-coverage th { text-align: left; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: #555; padding: 0.3rem 0.5rem; border-bottom: 1px solid #222; }
    .seo-coverage td { padding: 0.3rem 0.5rem; border-bottom: 1px solid #1a1a1a; vertical-align: middle; }
    .seo-coverage tr:last-child td { border-bottom: none; }
    .seo-bar-wrap { height: 5px; background: #2a2a2f; border-radius: 3px; overflow: hidden; flex: 1; }
    .seo-bar-fill { height: 100%; border-radius: 3px; }
    .seo-pct { font-size: 0.72rem; color: #666; width: 34px; text-align: right; flex-shrink: 0; }
    .seo-check-row { display: flex; align-items: center; gap: 0.4rem; }
    .seo-fail-count { font-size: 0.65rem; padding: 0.1rem 0.3rem; border-radius: 3px; }

    /* ── Tech Hints ── */
    .tech-hint { font-size: 0.82rem; padding: 0.45rem 0.6rem; border-radius: 6px; background: #111; border: 1px solid #222; margin-bottom: 0.4rem; }
    .tech-hint-note { font-size: 0.74rem; color: #555; margin-top: 0.2rem; }

    /* ── Queue Section ── */
    #queue-section { border-bottom: 1px solid #1a1a1a; }
    #queue-section .sidebar-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    #queue-section .section-toggle { font-size: 0.8rem; color: #444; }
    .queue-summary { display: flex; gap: 0.4rem; padding: 0.4rem 1rem; font-size: 0.7rem; color: #666; flex-wrap: wrap; }
    .qs-run { color: #6c6cff; } .qs-pend { color: #888; } .qs-fail { color: #f87171; }
    .queue-job { display: flex; align-items: center; gap: 0.4rem; padding: 0.35rem 1rem; font-size: 0.72rem; border-bottom: 1px solid #1a1a1a; border-left: 2px solid #333; }
    .queue-job.running { border-left-color: #6c6cff; } .queue-job.pending { border-left-color: #333; opacity: 0.7; }
    .queue-job.failed { border-left-color: #f87171; opacity: 0.85; }
    .qj-url { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #bbb; }
    .qj-status { font-size: 0.65rem; color: #555; }
    .qj-error { font-size: 0.65rem; color: #f87171; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .qj-bar-wrap { width: 36px; background: #222; border-radius: 2px; height: 3px; flex-shrink: 0; }
    .qj-fill { height: 100%; background: #6c6cff; border-radius: 2px; }
    .qj-cancel { color: #555; cursor: pointer; flex-shrink: 0; font-size: 0.8rem; transition: color 0.15s; }
    .qj-cancel:hover { color: #f87171; }

    /* ── Sidebar Controls Bar ── */
    #sidebar-controls { padding: 0.5rem 0.75rem; border-bottom: 1px solid #1a1a1a; }
    .ctrl-search input { width: 100%; padding: 0.35rem 0.6rem; background: #111; border: 1px solid #2a2a2f; border-radius: 5px; color: #ddd; font-size: 0.78rem; outline: none; margin-bottom: 0.35rem; }
    .ctrl-search input:focus { border-color: #6c6cff; }
    .ctrl-row { display: flex; align-items: center; gap: 0.3rem; }
    .score-pills { display: flex; gap: 0.15rem; flex-shrink: 0; }
    .sp { padding: 0.2rem 0.35rem; border: 1px solid #2a2a2f; background: #111; color: #666; font-size: 0.65rem; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
    .sp:hover { border-color: #444; } .sp.active { border-color: #6c6cff; color: #a5b4fc; }
    .sp.good.active { border-color: #4ade80; color: #4ade80; }
    .sp.mid.active  { border-color: #fb923c; color: #fb923c; }
    .sp.bad.active  { border-color: #f87171; color: #f87171; }
    #sort-select { flex: 1; padding: 0.2rem 0.3rem; background: #111; border: 1px solid #2a2a2f; color: #888; font-size: 0.7rem; border-radius: 4px; min-width: 0; outline: none; }
    #sort-select:focus { border-color: #6c6cff; }
    #group-btn { padding: 0.2rem 0.4rem; background: #111; border: 1px solid #2a2a2f; color: #666; font-size: 0.78rem; border-radius: 4px; cursor: pointer; flex-shrink: 0; transition: all 0.15s; }
    #group-btn:hover { border-color: #444; } #group-btn.active { border-color: #6c6cff; color: #a5b4fc; }

    /* ── Group Headers ── */
    .group-head { display: flex; align-items: center; gap: 0.3rem; padding: 0.4rem 1rem; cursor: pointer; background: #111; border-bottom: 1px solid #1a1a1a; font-size: 0.72rem; transition: background 0.15s; user-select: none; }
    .group-head:hover { background: #161618; }
    .group-hostname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #888; font-weight: 600; }
    .group-count { font-size: 0.65rem; padding: 0.1rem 0.3rem; background: #222; border-radius: 3px; color: #666; }
    .group-arrow { color: #444; flex-shrink: 0; }

    /* ── History Item with Checkbox ── */
    .history-item { position: relative; padding-left: 1.6rem; }
    .h-check { position: absolute; left: 0.4rem; top: 50%; transform: translateY(-50%); opacity: 0; cursor: pointer; accent-color: #6c6cff; transition: opacity 0.15s; }
    .history-item:hover .h-check, .history-item.sel-mode .h-check { opacity: 1; }
    .history-item.selected { background: #16161f !important; }

    /* ── Bulk Delete Bar ── */
    #bulk-bar { position: sticky; bottom: 0; background: #111; border-top: 1px solid #333; padding: 0.5rem 0.75rem; display: none; z-index: 10; }
    #bulk-bar button { width: 100%; padding: 0.35rem; border-radius: 6px; border: 1px solid #450a0a; background: #1a0a0a; color: #f87171; font-size: 0.72rem; cursor: pointer; transition: all 0.15s; }
    #bulk-bar button:hover { background: #2a0a0a; border-color: #f87171; }

    /* ── Sidebar Compare-Button ── */
    .compare-btn { margin: 0.5rem 0.75rem; padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #333; background: #1a1a1f; color: #888; font-size: 0.75rem; cursor: pointer; width: calc(100% - 1.5rem); }
    .compare-btn:hover { border-color: #6c6cff; color: #fff; }
    .compare-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Diff-Tab ── */
    .diff-score { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 1.4rem; font-weight: 800; }
    .diff-pos { color: #4ade80; } .diff-neg { color: #f87171; } .diff-zero { color: #888; }
    .diff-section { margin-bottom: 1rem; }
    .diff-section h4 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: #555; margin-bottom: 0.4rem; }
    .diff-list li { font-size: 0.85rem; padding: 0.2rem 0; display: flex; gap: 0.4rem; }
    .diff-empty { color: #555; font-size: 0.85rem; font-style: italic; }

    /* ── Diff-Selector ── */
    .diff-selector { background: #1a1a1f; border: 1px solid #333; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap; }
    .diff-selector label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 0.3rem; }
    .diff-selector select { padding: 0.45rem 0.7rem; background: #111; border: 1px solid #333; color: #eee; border-radius: 6px; font-size: 0.85rem; min-width: 220px; max-width: 100%; }
    .diff-selector select:focus { outline: none; border-color: #6c6cff; }
    .diff-selector .btn-run { padding: 0.45rem 1rem; border-radius: 6px; border: none; background: #6c6cff; color: #fff; font-size: 0.85rem; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .diff-selector .btn-run:hover { background: #5a5ae0; }
    .diff-result { display: none; }
    .diff-result.visible { display: block; }
  </style>
</head>
<body>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">✕</span>
  <img id="lb-img" src="" alt="" onclick="event.stopPropagation()">
</div>

<header>
  <h1 onclick="resetToWelcome()" style="cursor:pointer" title="Neue Suche starten">🩺 Website Doctor<span class="version-badge" id="ver"></span></h1>
  <div class="input-row">
    <input type="url" id="url-input" placeholder="https://example.com" />
    <button id="check-btn" onclick="startCheck()">Prüfen</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div id="queue-section" style="display:none">
      <div class="sidebar-head" onclick="toggleSection('queue')">
        Queue
        <span class="section-toggle">▾</span>
      </div>
      <div id="queue-panel"></div>
    </div>

    <div id="sidebar-controls">
      <div class="ctrl-search">
        <input id="search-input" type="search" placeholder="Filter…" oninput="onSearchInput(this.value)">
      </div>
      <div class="ctrl-row">
        <div class="score-pills">
          <button class="sp active" onclick="setScoreFilter('all')">All</button>
          <button class="sp good"   onclick="setScoreFilter('good')">≥70</button>
          <button class="sp mid"    onclick="setScoreFilter('mid')">40+</button>
          <button class="sp bad"    onclick="setScoreFilter('bad')">&lt;40</button>
        </div>
        <select id="sort-select" onchange="setSort(this.value)">
          <option value="date-desc">Neu</option>
          <option value="date-asc">Alt</option>
          <option value="score-desc">Score↓</option>
          <option value="score-asc">Score↑</option>
          <option value="alpha">A–Z</option>
        </select>
        <button id="group-btn" onclick="toggleGrouping()" title="Group by hostname">⊞</button>
      </div>
    </div>

    <div class="sidebar-head">Verlauf</div>
    <div id="history-list"><div class="empty">Noch keine Checks</div></div>

    <div id="bulk-bar"></div>

    <button class="compare-btn" id="compare-btn" onclick="goToCompareTab()" disabled>Vergleichen</button>
  </aside>

  <main>
    <div id="status-box">
      <div class="label">Crawl läuft…</div>
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
      <div id="status-text">Initialisiere Browser…</div>
      <div id="live-pages"></div>
    </div>
    <div id="error-box"></div>

    <div id="report">
      <div class="export-bar" id="export-bar" style="display:none">
        <button class="btn-export" onclick="exportJson()">↓ JSON</button>
        <button class="btn-export" onclick="exportCsv()">↓ CSV</button>
        <button class="btn-export" id="btn-pdf" onclick="exportPdf()">↓ PDF</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('overview')">Übersicht</button>
        <button class="tab-btn" onclick="switchTab('seo')">SEO</button>
        <button class="tab-btn" onclick="switchTab('geo')">GEO / AI</button>
        <button class="tab-btn" onclick="switchTab('mobile')">Mobile</button>
        <button class="tab-btn" id="tab-btn-diff" onclick="switchTab('diff')">Vergleich</button>
      </div>
      <div id="tab-overview" class="tab-panel active"></div>
      <div id="tab-seo"      class="tab-panel"></div>
      <div id="tab-geo"      class="tab-panel"></div>
      <div id="tab-mobile"   class="tab-panel"></div>
      <div id="tab-diff"     class="tab-panel"></div>
    </div>

    <div class="welcome" id="welcome">URL eingeben und auf <strong>Prüfen</strong> klicken<br>oder einen Eintrag aus dem Verlauf wählen</div>
  </main>
</div>

<script>
  // ── Sidebar State ────────────────────────────────────
  const sidebarState = {
    search: '',
    scoreFilter: 'all',
    sort: 'date-desc',
    grouped: false,
    selectedIds: new Set(),
    queueData: null
  }
  const collapsedGroups = new Set()

  let queuePollTimer = null
  let activeHistoryId = null
  let currentReport = null
  let historyList = []
  let pendingDiffFromId = null

  // ── Lightbox ─────────────────────────────────────────
  function openLightbox(src) {
    document.getElementById('lb-img').src = src
    document.getElementById('lightbox').classList.add('open')
    document.body.style.overflow = 'hidden'
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open')
    document.body.style.overflow = ''
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox() })

  // ── Fetch + Render ───────────────────────────────────
  async function fetchHistory() {
    const res = await fetch('/history')
    historyList = await res.json()
    renderHistoryList()
    document.getElementById('compare-btn').disabled = historyList.length < 2
  }

  async function fetchQueue() {
    const res = await fetch('/api/queue')
    sidebarState.queueData = await res.json()
    renderQueuePanel()
  }

  function renderQueuePanel() {
    const q = sidebarState.queueData
    const hasActivity = q && (q.pending > 0 || q.running > 0 || q.failed > 0)
    if (!q || !hasActivity) {
      document.getElementById('queue-section').style.display = 'none'
      return
    }
    document.getElementById('queue-section').style.display = 'block'
    const jobs = q.queue || []
    const summaryHtml = `<div class="queue-summary">
      <span class="qs-run">⚙ ${q.running}</span>
      <span class="qs-pend">· ${q.pending} pending</span>
      ${q.failed > 0 ? `<span class="qs-fail">· ${q.failed} failed</span>` : ''}
    </div>`
    const jobsHtml = jobs.map(j => {
      if (j._type === 'running') {
        const pct = j.progress ? Math.round((j.progress.current / j.progress.max) * 100) : 0
        return `<div class="queue-job running">
          <div class="qj-url">${escHtml(j.url)}</div>
          <div class="qj-bar-wrap"><div class="qj-fill" style="width:${pct}%"></div></div>
          <span class="qj-cancel" onclick="cancelJob('${j.id}')">✕</span>
        </div>`
      } else {
        return `<div class="queue-job pending">
          <div class="qj-url">${escHtml(j.url)}</div>
          <div class="qj-status">queued</div>
          <span class="qj-cancel" onclick="cancelJob('${j.id}')">✕</span>
        </div>`
      }
    }).join('')
    const failedHtml = (q.failedJobs || []).map(j => {
      const shortErr = j.error ? j.error.slice(0, 60) : 'Fehler'
      return `<div class="queue-job failed">
        <div class="qj-url" title="${escHtml(j.url)}">${escHtml(j.url)}</div>
        <div class="qj-error" title="${escHtml(j.error || '')}">⚠ ${escHtml(shortErr)}</div>
        <span class="qj-cancel" onclick="cancelJob('${j.id}')">✕</span>
      </div>`
    }).join('')
    document.getElementById('queue-panel').innerHTML = summaryHtml + jobsHtml + failedHtml
  }

  function applyFilters(list) {
    let r = [...list]
    if (sidebarState.search) {
      const q = sidebarState.search.toLowerCase()
      r = r.filter(h => (h.hostname || '').toLowerCase().includes(q) || (h.siteTitle || '').toLowerCase().includes(q))
    }
    if (sidebarState.scoreFilter === 'good') r = r.filter(h => h.score >= 70)
    if (sidebarState.scoreFilter === 'mid')  r = r.filter(h => h.score >= 40 && h.score < 70)
    if (sidebarState.scoreFilter === 'bad')  r = r.filter(h => h.score < 40)
    const sorts = {
      'date-desc':  (a,b) => new Date(b.date) - new Date(a.date),
      'date-asc':   (a,b) => new Date(a.date) - new Date(b.date),
      'score-desc': (a,b) => b.score - a.score,
      'score-asc':  (a,b) => a.score - b.score,
      'alpha':      (a,b) => (a.hostname || '').localeCompare(b.hostname || '')
    }
    r.sort(sorts[sidebarState.sort])
    return r
  }

  function groupByHostname(list) {
    const groups = new Map()
    for (const entry of list) {
      const key = entry.hostname || entry.url
      if (!groups.has(key)) groups.set(key, [])
      groups.get(key).push(entry)
    }
    return groups
  }

  function historyItemHtml(h) {
    const isSelected = sidebarState.selectedIds.has(h.id)
    const selClass = sidebarState.selectedIds.size > 0 ? ' sel-mode' : ''
    const scoreClass = h.score >= 70 ? 'good' : h.score >= 40 ? 'mid' : 'bad'
    const date = new Date(h.date).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' })
    const label = h.siteTitle || h.hostname || (() => { try { return new URL(h.url).hostname } catch { return h.url } })()
    return `<div class="history-item${h.id === activeHistoryId ? ' active' : ''}${isSelected ? ' selected' : ''}${selClass}" onclick="loadReport('${h.id}')">
      <input type="checkbox" class="h-check" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect('${h.id}')">
      <div class="h-url">${escHtml(label)}</div>
      <div class="h-date">${date}</div>
      <div class="h-badges">
        <span class="h-score ${scoreClass}">${h.score}</span>
        <span class="h-pages">${h.pageCount} Seiten</span>
        <button class="h-rerun" onclick="event.stopPropagation(); reRunAndDiff('${h.id}', '${escHtml(h.url)}')" title="Neu prüfen und vergleichen">↺</button>
      </div>
    </div>`
  }

  function renderHistoryList() {
    const filtered = applyFilters(historyList)
    const el = document.getElementById('history-list')
    if (!filtered.length) { el.innerHTML = '<div class="empty">Noch keine Checks</div>'; renderBulkBar(); return }

    let html = ''
    if (sidebarState.grouped) {
      const groups = groupByHostname(filtered)
      html = [...groups.entries()].map(([hostname, entries]) => {
        const isCollapsed = collapsedGroups.has(hostname)
        const groupHeader = `<div class="group-head" onclick="event.stopPropagation(); toggleGroup('${escHtml(hostname)}')">
          <span class="group-hostname">${escHtml(hostname)}</span>
          <span class="group-count">${entries.length}</span>
          <span class="group-arrow">${isCollapsed ? '▸' : '▾'}</span>
        </div>`
        if (isCollapsed) return groupHeader
        return groupHeader + entries.map(h => historyItemHtml(h)).join('')
      }).join('')
    } else {
      html = filtered.map(h => historyItemHtml(h)).join('')
    }
    el.innerHTML = html
    renderBulkBar()
  }

  function renderBulkBar() {
    const bar = document.getElementById('bulk-bar')
    if (sidebarState.selectedIds.size === 0) { bar.style.display = 'none'; return }
    bar.style.display = 'block'
    bar.innerHTML = `<button onclick="deleteSelected()">✕ ${sidebarState.selectedIds.size} löschen</button>`
  }

  function startQueuePolling() {
    if (queuePollTimer) return
    queuePollTimer = setInterval(async () => {
      await fetchQueue()
      const s = sidebarState.queueData
      if (!s || (s.pending === 0 && s.running === 0 && s.failed === 0)) {
        stopQueuePolling()
        await fetchHistory()
      }
    }, 2000)
  }

  function stopQueuePolling() {
    clearInterval(queuePollTimer)
    queuePollTimer = null
  }

  async function cancelJob(id) {
    await fetch(`/api/queue/${id}`, { method: 'DELETE' })
    await fetchQueue()
  }

  async function deleteSelected() {
    const ids = [...sidebarState.selectedIds]
    await fetch('/history', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }) })
    sidebarState.selectedIds.clear()
    await fetchHistory()
  }

  function toggleSelect(id) {
    if (sidebarState.selectedIds.has(id)) sidebarState.selectedIds.delete(id)
    else sidebarState.selectedIds.add(id)
    renderHistoryList()
  }

  function toggleSection(name) {
    const section = document.getElementById(name + '-section')
    section.style.display = section.style.display === 'none' ? 'block' : 'none'
  }

  function toggleGroup(hostname) {
    if (collapsedGroups.has(hostname)) collapsedGroups.delete(hostname)
    else collapsedGroups.add(hostname)
    renderHistoryList()
  }

  function toggleGrouping() {
    sidebarState.grouped = !sidebarState.grouped
    document.getElementById('group-btn').classList.toggle('active', sidebarState.grouped)
    renderHistoryList()
  }

  function onSearchInput(val) {
    sidebarState.search = val
    renderHistoryList()
  }

  function setScoreFilter(filter) {
    sidebarState.scoreFilter = filter
    document.querySelectorAll('.sp').forEach(b => {
      const isActive = (filter === 'all' && b.textContent === 'All') || (filter === 'good' && b.textContent === '≥70') || (filter === 'mid' && b.textContent === '40+') || (filter === 'bad' && b.textContent.includes('<'))
      b.classList.toggle('active', isActive)
    })
    renderHistoryList()
  }

  function setSort(sort) {
    sidebarState.sort = sort
    renderHistoryList()
  }

  // ── Check starten ────────────────────────────────────
  function resetToWelcome() {
    document.getElementById('report').style.display = 'none'
    document.getElementById('error-box').style.display = 'none'
    document.getElementById('status-box')?.style && (document.getElementById('status-box').style.display = 'none')
    document.getElementById('welcome').style.display = ''
    document.getElementById('url-input').value = ''
    document.getElementById('url-input').focus()
    document.getElementById('check-btn').disabled = false
    activeHistoryId = null
  }

  async function startCheck() {
    let url = document.getElementById('url-input').value.trim()
    if (!url) return
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url
    document.getElementById('url-input').value = url
    document.getElementById('check-btn').disabled = true
    document.getElementById('report').style.display = 'none'
    document.getElementById('welcome').style.display = 'none'
    document.getElementById('error-box').style.display = 'none'
    showStatus('Crawl startet…', 0)
    activeHistoryId = null

    const res = await fetch('/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) })
    if (!res.ok) {
      document.getElementById('check-btn').disabled = false
      const body = await res.json().catch(() => ({}))
      return showError(body.error || 'Server-Fehler beim Starten')
    }
    const { id } = await res.json()
    startQueuePolling()
    pollStatus(id)
  }

  async function reRunAndDiff(oldId, url) {
    pendingDiffFromId = oldId
    document.getElementById('url-input').value = url
    document.getElementById('check-btn').disabled = true
    document.getElementById('report').style.display = 'none'
    document.getElementById('welcome').style.display = 'none'
    document.getElementById('error-box').style.display = 'none'
    showStatus('Re-Run startet…', 0)
    activeHistoryId = null

    const res = await fetch('/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) })
    if (!res.ok) { pendingDiffFromId = null; return showError('Server-Fehler beim Starten') }
    const { id } = await res.json()
    startQueuePolling()
    setTimeout(() => pollStatus(id), 100)
  }

  function pollStatus(id) {
    const check = async () => {
      const res = await fetch(`/status/${id}`)
      if (!res.ok) return
      const data = await res.json()
      if (data.status === 'pending') {
        showStatus('In der Warteschlange…', 0)
        setTimeout(check, 800)
      } else if (data.status === 'running' && data.progress) {
        const pct = Math.round((data.progress.current / data.progress.max) * 100)
        const text = data.progress.current === 0
          ? 'Initialisiere Browser…'
          : `Seite ${data.progress.current}/${data.progress.max}: ${data.progress.url}`
        showStatus(text, pct)
        if (data.pages?.length) renderLivePages(data.pages)
        setTimeout(check, 500)
      } else if (data.status === 'running') {
        showStatus('Crawl läuft…', 0)
        setTimeout(check, 800)
      } else if (data.status === 'done') {
        hideStatus()
        await fetchHistory()
        await loadReport(id)
        document.getElementById('check-btn').disabled = false
        if (pendingDiffFromId && pendingDiffFromId !== id) {
          const diffFrom = pendingDiffFromId
          pendingDiffFromId = null
          goToCompareTab()
          await runDiff(diffFrom, id)
        }
      } else if (data.status === 'error' || data.status === 'failed') {
        hideStatus()
        showError(data.error || 'Crawl fehlgeschlagen')
        document.getElementById('check-btn').disabled = false
      } else {
        // unbekannter Status — weiter pollen
        setTimeout(check, 1000)
      }
    }
    check()
  }

  async function loadReport(id) {
    const res = await fetch(`/report/${id}`)
    if (!res.ok) return
    const report = await res.json()
    currentReport = report
    hideStatus()
    activeHistoryId = id
    fetchHistory()
    renderReport(report)
  }

  // ── Tabs ─────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => {
      const id = b.getAttribute('onclick')?.match(/'(\w+)'/)?.[1]
      b.classList.toggle('active', id === name)
    })
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'))
    document.getElementById('tab-' + name).classList.add('active')
  }

  // ── SVG Gauge ─────────────────────────────────────────
  function svgGauge(score, label, sub = '', size = 80) {
    if (score === '–' || score == null) {
      return `<div class="gauge-wrap">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <circle cx="${size/2}" cy="${size/2}" r="${size/2-6}" fill="none" stroke="#222" stroke-width="7"/>
          <text x="${size/2}" y="${size/2+5}" text-anchor="middle" fill="#444" font-size="14" font-weight="800">–</text>
        </svg>
        <div class="g-label">${label}</div>${sub ? `<div class="g-sub">${sub}</div>` : ''}
      </div>`
    }
    const n = Number(score)
    const color = n >= 70 ? '#4ade80' : n >= 40 ? '#fb923c' : '#f87171'
    const rad = size / 2 - 6
    const circ = 2 * Math.PI * rad
    const offset = circ * (1 - n / 100)
    const fontSize = size > 70 ? 1.4 : 1.1
    return `<div class="gauge-wrap">
      <div style="position:relative;width:${size}px;height:${size}px;margin:0 auto">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
          <circle cx="${size/2}" cy="${size/2}" r="${rad}" fill="none" stroke="#222" stroke-width="7"/>
          <circle cx="${size/2}" cy="${size/2}" r="${rad}" fill="none" stroke="${color}" stroke-width="7"
            stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
          <span style="font-size:${fontSize}rem;font-weight:800;color:${color}">${n}</span>
        </div>
      </div>
      <div class="g-label">${label}</div>${sub ? `<div class="g-sub">${sub}</div>` : ''}
    </div>`
  }

  // ── Helpers ──────────────────────────────────────────
  function scoreClass(n) { return n >= 70 ? 'score-good' : n >= 40 ? 'score-mid' : 'score-bad' }

  function escHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  function thumbHtml(screenshotPath, height = 130) {
    if (!screenshotPath) return `<div class="no-img" style="height:${height}px">Kein Screenshot</div>`
    const src = `/${screenshotPath}`
    return `<div class="thumb-wrap" style="height:${height}px" onclick="openLightbox('${src}')">
      <img src="${src}" loading="lazy" alt="">
      <span class="zoom-hint">🔍</span>
    </div>`
  }

  // ── C2 — Export ──────────────────────────────────────
  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime })
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: filename })
    a.click(); URL.revokeObjectURL(a.href)
  }

  function exportJson() {
    if (!currentReport) return
    downloadBlob(JSON.stringify(currentReport, null, 2), `report_${currentReport.id}.json`, 'application/json')
  }

  function exportCsv() {
    if (!currentReport) return
    const rows = [['URL', 'Status', 'Typ', 'Ladezeit (ms)', 'JS-Fehler (first-party)']]
    currentReport.pages.forEach(p => rows.push([
      p.url, p.statusCode ?? '', p.type ?? '', p.loadTime ?? '',
      p.jsErrors?.filter(e => e.firstParty).length ?? 0
    ]))
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n')
    downloadBlob(csv, `report_${currentReport.id}.csv`, 'text/csv')
  }

  // ── C1 — Diff/Vergleich ───────────────────────────────
  let currentDiffIds = { idA: null, idB: null }

  function goToCompareTab() {
    document.getElementById('report').style.display = 'block'
    document.getElementById('welcome').style.display = 'none'
    renderDiffSelector()
    switchTab('diff')
  }

  function renderDiffSelector() {
    const opts = historyList.map(h =>
      `<option value="${escHtml(h.id)}">${escHtml(h.siteTitle || h.hostname || h.url)} – ${new Date(h.date).toLocaleDateString('de-DE')} (${h.score})</option>`
    ).join('')

    const selA = historyList.length >= 2 ? historyList[1].id : (historyList[0]?.id ?? '')
    const selB = historyList[0]?.id ?? ''

    document.getElementById('tab-diff').innerHTML = `
      <div class="diff-selector">
        <div><label>Report A (älter)</label><select id="sel-a">${opts}</select></div>
        <div><label>Report B (neuer)</label><select id="sel-b">${opts}</select></div>
        <button class="btn-run" onclick="runDiff(document.getElementById('sel-a').value, document.getElementById('sel-b').value)">Vergleichen</button>
      </div>
      <div id="diff-result" class="diff-result"></div>`

    if (historyList.length >= 2) {
      document.getElementById('sel-a').value = selA
      document.getElementById('sel-b').value = selB
    }
  }

  async function runDiff(idA, idB) {
    if (idA === idB) return alert('Bitte zwei verschiedene Reports wählen')
    const res = await fetch(`/diff/${idA}/${idB}`)
    if (!res.ok) return alert('Diff konnte nicht geladen werden')
    const diff = await res.json()
    currentDiffIds = { idA, idB }
    renderDiffResult(diff)
  }

  function renderDiffResult(d) {
    const sign = n => n > 0 ? `+${n}` : `${n}`
    const cls  = n => n > 0 ? 'diff-pos' : n < 0 ? 'diff-neg' : 'diff-zero'

    const scoreHtml = `<div class="card" style="margin-bottom:1rem">
      <h3>Score-Änderung</h3>
      <div style="display:flex;gap:2rem;flex-wrap:wrap;padding:0.5rem 0">
        <div><div style="font-size:0.75rem;color:#555;margin-bottom:0.2rem">Gesamt-Score</div>
          <span class="diff-score ${cls(d.scoreChange)}">${sign(d.scoreChange)}</span></div>
        <div><div style="font-size:0.75rem;color:#555;margin-bottom:0.2rem">SEO-Score</div>
          <span class="diff-score ${cls(d.seoScoreChange)}">${sign(d.seoScoreChange)}</span></div>
      </div>
    </div>`

    const weakHtml = `<div class="two-col">
      <div class="card diff-section"><h4>Neue Schwächen</h4>
        ${d.newWeaknesses.length ? `<ul class="diff-list">${d.newWeaknesses.map(w=>`<li><span class="dot-red">✗</span>${escHtml(w)}</li>`).join('')}</ul>`
          : '<p class="diff-empty">Keine neuen Schwächen</p>'}
      </div>
      <div class="card diff-section"><h4>Behobene Schwächen</h4>
        ${d.resolvedWeaknesses.length ? `<ul class="diff-list">${d.resolvedWeaknesses.map(w=>`<li><span class="dot-green">✓</span>${escHtml(w)}</li>`).join('')}</ul>`
          : '<p class="diff-empty">Keine behobenen Schwächen</p>'}
      </div>
    </div>`

    const pagesHtml = `<div class="two-col">
      <div class="card diff-section"><h4>Neue Seiten (${d.newPages.length})</h4>
        ${d.newPages.length ? `<ul class="diff-list">${d.newPages.map(u=>`<li><span class="dot-green">+</span>${escHtml(u)}</li>`).join('')}</ul>`
          : '<p class="diff-empty">Keine neuen Seiten</p>'}
      </div>
      <div class="card diff-section"><h4>Entfernte Seiten (${d.removedPages.length})</h4>
        ${d.removedPages.length ? `<ul class="diff-list">${d.removedPages.map(u=>`<li><span class="dot-red">-</span>${escHtml(u)}</li>`).join('')}</ul>`
          : '<p class="diff-empty">Keine entfernten Seiten</p>'}
      </div>
    </div>`

    const changesHtml = d.pageChanges.length ? `<div class="card diff-section"><h4>Seiten-Änderungen</h4>
      <ul class="diff-list" style="flex-direction:column;gap:0">${d.pageChanges.map(c =>
        `<li style="flex-direction:column;align-items:flex-start;padding:0.4rem 0;border-bottom:1px solid #1a1a1a">
          <span style="font-size:0.8rem;color:#aaa">${escHtml(c.url)}</span>
          <span style="font-size:0.75rem;color:#666;margin-top:0.2rem">
            Ladezeit: <span class="${cls(c.loadTimeChange)}">${sign(c.loadTimeChange)}ms</span>
            ${c.jsErrorsChange !== 0 ? `  JS-Fehler: <span class="${cls(c.jsErrorsChange)}">${sign(c.jsErrorsChange)}</span>` : ''}
          </span>
        </li>`
      ).join('')}</ul></div>` : ''

    const result = document.getElementById('diff-result')
    result.innerHTML = `
      <div class="export-bar" style="margin-bottom:1rem">
        <button class="btn-export" id="btn-diff-pdf" onclick="exportDiffPdf()">↓ PDF</button>
      </div>
      <p style="font-size:0.8rem;color:#555;margin-bottom:1rem">${escHtml(d.urlA)} → ${escHtml(d.urlB)}</p>
      ${scoreHtml}${weakHtml}${pagesHtml}${changesHtml}`
    result.classList.add('visible')
  }

  // ── Render ───────────────────────────────────────────
  function renderReport(r) {
    document.getElementById('welcome').style.display = 'none'
    renderOverview(r)
    renderSeo(r)
    renderGeo(r)
    renderMobile(r)
    renderDiffSelector()
    document.getElementById('report').style.display = 'block'
    document.getElementById('export-bar').style.display = 'flex'
    switchTab('overview')
  }

  function renderOverview(r) {
    const seoScore = r.seo?.score ?? '–'
    const mobileScore = r.mobile?.score ?? '–'
    const secScore = r.security?.score ?? '–'

    // ── Site-Header ──
    const title = escHtml(r.siteTitle || r.hostname || r.url)
    const desc = r.siteDescription ? `<p class="sh-desc">${escHtml(r.siteDescription)}</p>` : ''
    const date = new Date(r.timestamp).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })
    const siteHeader = `<div class="site-header-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap">
        <div>
          <div class="sh-title">${title}</div>
          <a class="sh-url" href="${escHtml(r.url)}" target="_blank" rel="noopener">🔗 ${escHtml(r.url)}</a>
          ${desc}
        </div>
        <div style="font-size:0.72rem;color:#444;white-space:nowrap">${date}</div>
      </div>
    </div>`

    const geoScore = r.geo?.score ?? '–'
    const geoWarn = typeof geoScore === 'number' && geoScore < 50
      ? `<div style="font-size:0.65rem;color:#f87171;font-weight:700;margin-top:2px;text-align:center">⚠ KI-Sichtbarkeit kritisch</div>`
      : ''

    // ── Gauges ──
    const gauges = `<div class="gauge-row">
      ${svgGauge(r.score,    'Gesamt-Score',    `${r.pageCount} Seiten`, 90)}
      ${svgGauge(seoScore,   'SEO-Score',       '21 Checks', 90)}
      <div style="display:flex;flex-direction:column;align-items:center">
        ${svgGauge(geoScore, 'GEO / AI-Score',  '7 Checks', 90)}
        ${geoWarn}
      </div>
      ${svgGauge(mobileScore,'Mobile-Score',    'iPhone 13', 90)}
      ${svgGauge(secScore,   'Security-Score',  '6 Header', 90)}
    </div>`

    // ── Stats Strip ──
    const brokenCount = r.pages.filter(p => p.statusCode !== 200).length
    const jsErrCount  = r.pages.filter(p => p.jsErrors?.some(e => e.firstParty)).length
    const avgLoad     = Math.round(r.pages.reduce((s,p) => s + (p.loadTime ?? 0), 0) / (r.pages.length || 1))
    const statsStrip = `<div class="stats-strip">
      <div class="stat-pill"><div class="sp-val ${brokenCount > 0 ? 'score-bad' : 'score-good'}">${brokenCount}</div><div class="sp-label">Broken Pages</div></div>
      <div class="stat-pill"><div class="sp-val ${jsErrCount > 0 ? 'score-bad' : 'score-good'}">${jsErrCount}</div><div class="sp-label">Seiten mit JS-Fehler</div></div>
      <div class="stat-pill"><div class="sp-val ${avgLoad > 3000 ? 'score-bad' : avgLoad > 1500 ? 'score-mid' : 'score-good'}">${avgLoad}ms</div><div class="sp-label">Ø Ladezeit</div></div>
      <div class="stat-pill"><div class="sp-val">${r.pages.filter(p=>p.statusCode===200).length}</div><div class="sp-label">OK-Seiten</div></div>
    </div>`

    // ── Priority Issues ──
    const priorityIssues = r.priorityIssues?.length
      ? r.priorityIssues.map(i => {
          const badgeClass = i.severity === 'critical' ? 'critical' : i.severity === 'warning' ? 'warning' : 'info'
          const label = { critical: 'Kritisch', warning: 'Warnung', info: 'Info' }[i.severity] ?? i.severity
          const note = i.note ? `<div class="pi-note">${escHtml(i.note)}</div>` : ''
          return `<div class="priority-item ${badgeClass}">
            <span class="pi-badge ${badgeClass}">${label}</span>
            <div class="pi-text">${escHtml(i.label)}${note}</div>
          </div>`
        }).join('')
      : '<p style="color:#555;font-size:0.85rem">Keine kritischen Probleme gefunden.</p>'

    // ── Security Card ──
    const secHeaderMap = {
      hsts: r.pages[0]?.responseHeaders?.hsts,
      xFrameOptions: r.pages[0]?.responseHeaders?.xFrameOptions,
      xContentTypeOptions: r.pages[0]?.responseHeaders?.xContentTypeOptions,
      csp: r.pages[0]?.responseHeaders?.csp,
      referrerPolicy: r.pages[0]?.responseHeaders?.referrerPolicy,
      cacheControl: r.pages[0]?.responseHeaders?.cacheControl,
    }
    const secChecks = (r.security?.checks ?? []).map(c => {
      const val = secHeaderMap[c.key]
      return `<div class="sec-row">
        <span>${c.pass ? '✅' : '❌'}</span>
        <span>${escHtml(c.label)}</span>
        ${c.pass && val ? `<span class="sec-val" title="${escHtml(val)}">${escHtml(val.slice(0,40))}${val.length > 40 ? '…' : ''}</span>` : ''}
      </div>`
    }).join('')

    // ── Performance Card ──
    let perfHtml = '<p style="color:#555;font-size:0.82rem">Keine Timing-Daten verfügbar.</p>'
    if (r.performanceSummary) {
      const ps = r.performanceSummary
      const colorMs = ms => ms > 2000 ? '#f87171' : ms > 800 ? '#fb923c' : '#4ade80'
      perfHtml = `<div class="perf-grid">
        <div class="perf-cell"><div class="pc-val" style="color:${colorMs(ps.avgTtfb)}">${ps.avgTtfb}ms</div><div class="pc-label">Ø TTFB</div></div>
        <div class="perf-cell"><div class="pc-val" style="color:${colorMs(ps.avgDomReady)}">${ps.avgDomReady}ms</div><div class="pc-label">Ø DOM ready</div></div>
        <div class="perf-cell"><div class="pc-val" style="color:${colorMs(ps.avgFullyLoaded)}">${ps.avgFullyLoaded}ms</div><div class="pc-label">Ø Fully Loaded</div></div>
        <div class="perf-cell"><div class="pc-val" style="color:${colorMs(ps.p75Ttfb)}">${ps.p75Ttfb}ms</div><div class="pc-label">P75 TTFB</div></div>
        <div class="perf-cell"><div class="pc-val" style="color:${colorMs(ps.p75FullyLoaded)}">${ps.p75FullyLoaded}ms</div><div class="pc-label">P75 Loaded</div></div>
        <div class="perf-cell"><div class="pc-val ${ps.slowPages > 0 ? 'score-bad' : 'score-good'}">${ps.slowPages}</div><div class="pc-label">Seiten > 3s</div></div>
      </div>`
    }

    // ── Tech Hints ──
    let techHtml = ''
    if (r.techHints?.length) {
      techHtml = `<div class="card" style="margin-bottom:1rem"><h3>Technische Hinweise</h3>
        ${r.techHints.map(t => {
          const col = t.severity === 'critical' ? '#f87171' : t.severity === 'warning' ? '#fb923c' : '#818cf8'
          return `<div class="tech-hint">
            <span style="color:${col};font-weight:600">${escHtml(t.label)}</span>
            <div class="tech-hint-note">${escHtml(t.note)}</div>
          </div>`
        }).join('')}
      </div>`
    }

    // ── Top Deviations ──
    let deviationsHtml = ''
    if (r.topDeviations?.length) {
      const cards = r.topDeviations.map(d => {
        const seoTag = d.seoScore != null ? `<span class="badge b-${d.seoScore < 50 ? 'err' : 'ms'}">SEO ${d.seoScore}</span>` : ''
        const loadTag = d.loadTime ? `<span class="badge b-ms">${d.loadTime}ms</span>` : ''
        const reasons = d.reasons.map(r => `<span class="badge b-err">${escHtml(r)}</span>`).join(' ')
        return `<div class="deviation-card">
          <div class="dev-img" onclick="openLightbox('/${escHtml(d.screenshotPath)}')">
            <img src="/${escHtml(d.screenshotPath)}" loading="lazy" alt="${escHtml(d.title || d.url)}">
            <div class="dev-img-hint">🔍 Vergrößern</div>
          </div>
          <div class="dev-info">
            <div class="dev-title">${escHtml(d.title || '(kein Titel)')}</div>
            <div class="dev-url"><a href="${escHtml(d.url)}" target="_blank" rel="noopener">${escHtml(d.url)}</a></div>
            <div class="dev-badges">${seoTag}${loadTag}${reasons}</div>
          </div>
        </div>`
      }).join('')
      deviationsHtml = `<div class="card" style="margin-bottom:1rem">
        <h3>📸 Auffälligste Seiten</h3>
        <p style="font-size:0.78rem;color:#666;margin:0 0 0.8rem">Die drei Seiten mit den stärksten Abweichungen bei SEO, Ladezeit oder JS-Fehlern.</p>
        <div class="deviations-grid">${cards}</div>
      </div>`
    }

    // ── Actions ──
    const actions = r.actions.map(a => `<li><span class="dot-blue">→</span>${escHtml(a)}</li>`).join('') || '<li style="color:#555">Keine Maßnahmen</li>'

    // ── Pages Grid ──
    const pages = r.pages.map(p => {
      const badge = p.statusCode === 200 ? `<span class="badge b-ok">${p.statusCode}</span>` : `<span class="badge b-err">${p.statusCode ?? '?'}</span>`
      const ms = p.loadTime ? `<span class="badge b-ms">${p.loadTime}ms</span>` : ''
      const jsErrBadge = p.jsErrors?.some(e => e.firstParty) ? `<span class="badge b-err">JS ⚠ ${p.jsErrors.filter(e=>e.firstParty).length}</span>` : ''

      const timingBars = p.timing ? (() => {
        const max = Math.max(p.timing.fullyLoaded || 1, 1000)
        const cls = t => t > 2000 ? 'bad' : t > 800 ? 'slow' : ''
        const bar = (lbl, val) => val != null
          ? `<div class="t-row"><span class="t-label">${lbl}</span><div class="t-bar-wrap"><div class="t-bar ${cls(val)}" style="width:${Math.min((val/max)*100,100)}%"></div></div><span class="t-ms">${val}ms</span></div>`
          : ''
        return `<div class="timing-bars">${bar('TTFB', p.timing.ttfb)}${bar('DOM', p.timing.domReady)}${bar('Geladen', p.timing.fullyLoaded)}</div>`
      })() : ''

      return `<div class="page-card">
        ${thumbHtml(p.screenshotPath, 130)}
        <div class="pi">
          <div class="pi-type">${escHtml(p.type)}</div>
          <div class="pi-title">${escHtml(p.title || '(kein Titel)')}</div>
          <div class="pi-url"><a href="${escHtml(p.url)}" target="_blank" rel="noopener">${escHtml(p.url)}</a></div>
          <div class="pi-meta">${badge}${ms}${jsErrBadge}</div>
          ${timingBars}
        </div>
      </div>`
    }).join('')

    document.getElementById('tab-overview').innerHTML = `
      ${siteHeader}
      ${gauges}
      ${statsStrip}

      <div class="card" style="margin-bottom:1rem">
        <h3>Prioritäts-Probleme</h3>
        <div class="priority-list">${priorityIssues}</div>
      </div>

      ${deviationsHtml}

      ${techHtml}

      <div class="two-col" style="margin-bottom:1rem">
        <div class="card"><h3>Security-Header</h3><div class="security-checks">${secChecks || '<p style="color:#555;font-size:0.82rem">Keine Daten.</p>'}</div></div>
        <div class="card"><h3>Performance-Metriken</h3>${perfHtml}</div>
      </div>

      <div class="card" style="margin-bottom:1rem"><h3>Empfohlene Maßnahmen</h3><ul>${actions}</ul></div>

      <div class="card"><h3>Gecrawlte Seiten (${r.pages.length})</h3><div class="pages-grid">${pages}</div></div>`
  }

  function renderSeo(r) {
    if (!r.seo) {
      document.getElementById('tab-seo').innerHTML = '<p style="color:#555;padding:1rem">Keine SEO-Daten in diesem Report.</p>'
      return
    }

    const pageBlocks = (r.seo.pages || []).map(p => {
      const pageData = r.pages?.find(pg => pg.url === p.url)
      const jsErrors = pageData?.jsErrors ?? []
      const firstParty = jsErrors.filter(e => e.firstParty)
      const thirdParty = jsErrors.filter(e => !e.firstParty)

      const thumb = pageData?.screenshotPath
        ? `<div class="seo-thumb-wrap"><img class="seo-thumb" src="/${pageData.screenshotPath}" loading="lazy" onclick="openLightbox('/${pageData.screenshotPath}')" alt=""></div>`
        : ''

      const items = (p.checks || p.issues || []).map(i => {
        if (i.skipped) {
          return `<div class="seo-issue"><span class="icon">⏭</span><span class="seo-skipped">${escHtml(i.label)} – übersprungen (nicht indexiert)</span></div>`
        }
        const weightBadge = i.weight ? `<span class="seo-weight">[${i.weight}]</span>` : ''
        const detail = !i.pass
          ? `${i.value ? `<span class="seo-value">${escHtml(i.value)}</span>` : ''}${i.suggestion ? `<span class="seo-suggestion">→ ${escHtml(i.suggestion)}</span>` : ''}`
          : ''
        return `<div class="seo-issue"><span class="icon">${i.pass ? '✅' : '⚠️'}</span><span>${escHtml(i.label)}${weightBadge}${detail}</span></div>`
      }).join('')

      const jsBlock = jsErrors.length ? `<div class="seo-js-errors">
        ${firstParty.length ? `<div style="font-size:0.72rem;color:#f87171;font-weight:600;margin-bottom:0.25rem">JS-Fehler – First Party (${firstParty.length})</div>${firstParty.map(e =>
          `<div class="seo-js-err"><span class="seo-js-err-type">${escHtml(e.type)}</span><span>${escHtml(e.message)}</span></div>`
        ).join('')}` : ''}
        ${thirdParty.length ? `<div style="font-size:0.72rem;color:#555;font-weight:600;margin:0.35rem 0 0.2rem">Third Party – ignoriert (${thirdParty.length})</div>${thirdParty.map(e =>
          `<div class="seo-js-err" style="opacity:0.45"><span class="seo-js-err-type">${escHtml(e.type)}</span><span>${escHtml(e.message)}</span></div>`
        ).join('')}` : ''}
      </div>` : ''

      const nonIndexBadge = p.indexable === false
        ? '<span style="font-size:0.68rem;padding:0.1rem 0.4rem;border-radius:3px;background:#1a1a1a;color:#555;margin-left:0.5rem">nicht indexiert – Checks übersprungen</span>'
        : ''

      return `<div class="seo-page">
        ${thumb}
        <div class="seo-checks">
          <div class="seo-page-url"><a href="${escHtml(p.url)}" target="_blank" rel="noopener">${escHtml(p.url)}</a>${nonIndexBadge}</div>
          ${items}${jsBlock}
        </div>
      </div>`
    }).join('')

    // ── SEO Coverage Matrix ──
    const allPages = r.seo.pages || []
    const getChecks = p => p.checks || p.issues || []
    const checkIds = [...new Set(allPages.flatMap(p => getChecks(p).map(c => c.id)))]
    const coverageRows = checkIds.map(id => {
      const allChecks = allPages.flatMap(p => getChecks(p).filter(c => c.id === id && !c.skipped))
      if (!allChecks.length) return ''
      const passCount = allChecks.filter(c => c.pass).length
      const pct = Math.round((passCount / allChecks.length) * 100)
      const fillColor = pct === 100 ? '#4ade80' : pct >= 60 ? '#fb923c' : '#f87171'
      const label = allChecks[0].label.replace(/\(.*?\)/g, '').trim()
      const weight = allChecks[0].weight
      return `<tr>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(label)}</td>
        <td style="width:140px">
          <div class="seo-check-row">
            <div class="seo-bar-wrap"><div class="seo-bar-fill" style="width:${pct}%;background:${fillColor}"></div></div>
            <span class="seo-pct">${pct}%</span>
          </div>
        </td>
        <td style="width:60px;text-align:center">
          <span class="seo-fail-count" style="background:${passCount < allChecks.length ? '#1a0505' : '#0a1a0a'};color:${passCount < allChecks.length ? '#f87171' : '#4ade80'}">
            ${passCount}/${allChecks.length}
          </span>
        </td>
        <td style="width:32px;text-align:right"><span class="seo-weight">[${weight}]</span></td>
      </tr>`
    }).join('')

    document.getElementById('tab-seo').innerHTML = `
      <div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;flex-wrap:wrap">
        ${svgGauge(r.seo.score, 'SEO-Score', '', 80)}
        <div style="flex:1">
          <div style="font-size:0.8rem;color:#888;margin-bottom:0.4rem">SEO-Checks über alle ${allPages.length} Seiten</div>
          <div style="font-size:0.82rem;color:#666">
            ${allPages.length} gecrawlte Seiten &nbsp;·&nbsp;
            ${checkIds.length} Check-Kategorien &nbsp;·&nbsp;
            <span style="color:#4ade80">${allPages.flatMap(p=>getChecks(p).filter(c=>c.pass&&!c.skipped)).length} bestanden</span> /
            <span style="color:#f87171">${allPages.flatMap(p=>getChecks(p).filter(c=>!c.pass&&!c.skipped)).length} fehlgeschlagen</span>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:1rem">
        <h3>SEO-Coverage aller Checks</h3>
        <table class="seo-coverage">
          <thead><tr><th>Check</th><th>Bestanden</th><th>Seiten</th><th>Gew.</th></tr></thead>
          <tbody>${coverageRows || '<tr><td colspan="4" style="color:#555">Keine Daten</td></tr>'}</tbody>
        </table>
      </div>

      <div class="card"><h3>Details pro Seite</h3>${pageBlocks || '<p style="color:#555">Keine Daten</p>'}</div>`
  }

  function renderGeo(r) {
    const el = document.getElementById('tab-geo')
    if (!r.geo) {
      el.innerHTML = '<p style="color:#555;padding:1rem">Keine GEO-Daten in diesem Report. Bitte neu crawlen.</p>'
      return
    }
    const g = r.geo
    const scored  = (g.checks || []).filter(c => c.weight > 0)
    const infoChecks = (g.checks || []).filter(c => c.informational)

    // ── Score + Kurzübersicht ──
    const passCount = scored.filter(c => c.pass).length
    const geoTabWarn = g.score < 50
      ? `<div style="display:inline-block;margin-top:6px;padding:3px 8px;background:#7f1d1d;color:#fca5a5;border-radius:4px;font-size:0.68rem;font-weight:700">⚠ KI-Sichtbarkeit kritisch (Score &lt; 50)</div>`
      : ''
    const header = `<div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;align-items:center">
        ${svgGauge(g.score, 'GEO / AI-Score', '', 80)}
        ${geoTabWarn}
      </div>
      <div style="flex:1">
        <div style="font-size:0.8rem;color:#888;margin-bottom:0.4rem">Generative Engine Optimization – wie gut KI-Modelle deine Site lesen können</div>
        <div style="font-size:0.82rem;color:#666">
          ${scored.length} Kern-Checks &nbsp;·&nbsp;
          <span style="color:#4ade80">${passCount} bestanden</span> /
          <span style="color:#f87171">${scored.length - passCount} fehlgeschlagen</span>
        </div>
      </div>
    </div>`

    // ── Kern-Checks ──
    const coreRows = scored.map(c => {
      const catColor = { A:'#818cf8', B:'#34d399', C:'#fb923c', D:'#60a5fa', E:'#a78bfa' }[c.category] || '#666'
      const detail = !c.pass && c.suggestion
        ? `<div style="font-size:0.74rem;color:#fb923c;margin-top:0.25rem">→ ${escHtml(c.suggestion)}</div>`
        : ''
      const extraDetail = c.detail && Array.isArray(c.detail) && c.detail.length
        ? `<div style="font-size:0.7rem;color:#555;margin-top:0.15rem">${
            c.detail.map(d => typeof d === 'string'
              ? `<span style="background:#111;padding:0.1rem 0.3rem;border-radius:3px;margin-right:0.3rem">${escHtml(d)}</span>`
              : d.url ? `<a href="${escHtml(d.url)}" target="_blank" style="color:#6c6cff;font-size:0.68rem">${escHtml(d.prop)}: ${escHtml(d.url.slice(0,50))}</a><br>`
              : d.q ? `<em style="color:#888">${escHtml(d.q)}</em>`
              : ''
            ).join('')
          }</div>`
        : ''
      return `<div style="padding:0.6rem 0.8rem;border-radius:7px;background:${c.pass ? '#0a1a0a' : '#150505'};border:1px solid ${c.pass ? '#1a3a1a' : '#3a0a0a'};margin-bottom:0.5rem">
        <div style="display:flex;align-items:center;gap:0.5rem">
          <span style="font-size:0.6rem;font-weight:700;padding:0.1rem 0.3rem;border-radius:3px;background:#111;color:${catColor}">${c.category}</span>
          <span style="font-size:0.85rem;flex:1">${c.pass ? '✅' : '❌'} ${escHtml(c.label)}</span>
          <span style="font-size:0.65rem;background:#1e1b4b;color:#818cf8;padding:0.1rem 0.3rem;border-radius:3px">[${c.weight}]</span>
        </div>
        ${detail}${extraDetail}
      </div>`
    }).join('')

    // ── AI-Bot Details ──
    const botCheck = (g.checks || []).find(c => c.id === 'ai-bots-allowed')
    const botDetails = botCheck?.detail?.length
      ? `<div class="card" style="margin-bottom:1rem"><h3>AI-Bot Status in robots.txt</h3>
          ${botCheck.detail.map(b => `
            <div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;border-bottom:1px solid #1a1a1a;font-size:0.82rem">
              <span>${b.pass ? '✅' : '❌'}</span>
              <span style="font-weight:600;min-width:140px">${escHtml(b.name)}</span>
              <span style="color:#666;font-size:0.75rem">${escHtml(b.owner)}</span>
              <span style="margin-left:auto;font-size:0.7rem;padding:0.1rem 0.4rem;border-radius:3px;background:${b.pass ? '#0a1a0a' : '#1a0505'};color:${b.pass ? '#4ade80' : '#f87171'}">${escHtml(b.status)}</span>
            </div>`).join('')}
          ${g.robotsTxtRaw ? `<details style="margin-top:0.75rem"><summary style="font-size:0.72rem;color:#555;cursor:pointer">robots.txt anzeigen</summary><pre style="font-size:0.68rem;color:#555;margin-top:0.4rem;overflow:auto;max-height:200px">${escHtml(g.robotsTxtRaw)}</pre></details>` : ''}
        </div>`
      : ''

    // ── ai.txt / llms.txt Status ──
    const fileChecks = [
      { id: 'ai-txt',   label: '/ai.txt',   obj: g.aiTxt   },
      { id: 'llms-txt', label: '/llms.txt', obj: g.llmsTxt },
    ]
    const fileRow = fileChecks.map(f => {
      const exists = f.obj?.exists
      const content = f.obj?.content
      return `<div style="padding:0.5rem 0.7rem;border-radius:6px;background:${exists?'#0a1a0a':'#111'};border:1px solid ${exists?'#1a3a1a':'#222'};margin-bottom:0.5rem">
        <div style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem">
          <span>${exists ? '✅' : '❌'}</span>
          <span style="font-weight:600">${f.label}</span>
          <span style="margin-left:auto;font-size:0.72rem;color:${exists?'#4ade80':'#555'}">${exists ? 'vorhanden' : 'fehlt'}</span>
        </div>
        ${content ? `<div style="font-size:0.68rem;color:#555;margin-top:0.3rem;font-family:monospace">${escHtml(content.slice(0,120))}…</div>` : ''}
      </div>`
    }).join('')

    // ── Informelle Checks ──
    const infoRows = infoChecks.filter(c => c.id !== 'schema-classification').map(c => {
      const col = c.pass ? '#4ade80' : '#fb923c'
      return `<div style="display:flex;align-items:flex-start;gap:0.5rem;padding:0.35rem 0;border-bottom:1px solid #1a1a1a;font-size:0.82rem">
        <span style="color:${col}">${c.pass ? '✓' : '!'}</span>
        <div>
          <span>${escHtml(c.label)}</span>
          ${c.suggestion ? `<div style="font-size:0.72rem;color:#666;margin-top:0.1rem">${escHtml(c.suggestion)}</div>` : ''}
        </div>
      </div>`
    }).join('')

    // ── Schema-Klassifizierung ──
    const schemaCl = (g.checks || []).find(c => c.id === 'schema-classification')
    const schemaCard = schemaCl ? `<div class="card" style="margin-bottom:1rem"><h3>Schema-Typ-Analyse (E-4)</h3>
      <div style="font-size:0.85rem;color:#ddd;margin-bottom:0.5rem">${escHtml(schemaCl.value || schemaCl.label)}</div>
      ${schemaCl.detail?.specific?.length ? `<div style="font-size:0.75rem;color:#4ade80">✅ Spezifisch: ${schemaCl.detail.specific.map(t=>`<span style="background:#0a1a0a;padding:0.1rem 0.4rem;border-radius:3px;margin-right:0.3rem">${escHtml(t)}</span>`).join('')}</div>` : ''}
      ${schemaCl.detail?.generic?.length ? `<div style="font-size:0.75rem;color:#fb923c;margin-top:0.25rem">⚠ Generisch: ${schemaCl.detail.generic.map(t=>`<span style="background:#1a0505;padding:0.1rem 0.4rem;border-radius:3px;margin-right:0.3rem">${escHtml(t)}</span>`).join('')}</div>` : ''}
    </div>` : ''

    // ── LLM Snippet-Previews ──
    const snippets = g.snippetPreviews?.length
      ? `<div class="card" style="margin-bottom:1rem"><h3>LLM Snippet-Previews (was KI als Featured Snippet sieht)</h3>
          ${g.snippetPreviews.map(s => `<div style="margin-bottom:0.75rem;padding:0.6rem 0.8rem;background:#111;border:1px solid #222;border-radius:6px;border-left:3px solid #6c6cff">
            <div style="font-size:0.68rem;color:#555;margin-bottom:0.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(s.url)}</div>
            <div style="font-size:0.82rem;color:#ccc;line-height:1.5">${escHtml(s.snippet)}</div>
          </div>`).join('')}
        </div>`
      : ''

    // ── Q&A-Beispiele ──
    const qaCheck = (g.checks || []).find(c => c.id === 'qa-structure')
    const qaExamples = qaCheck?.detail?.length
      ? `<div class="card" style="margin-bottom:1rem"><h3>Gefundene Q&A-Strukturen (B-3)</h3>
          ${qaCheck.detail.map(qa => `<div style="padding:0.5rem 0;border-bottom:1px solid #1a1a1a">
            <div style="font-size:0.8rem;font-weight:600;color:#a5b4fc">❓ ${escHtml(qa.q)}</div>
            <div style="font-size:0.78rem;color:#888;margin-top:0.15rem">${escHtml(qa.a)}…</div>
          </div>`).join('')}
        </div>`
      : ''

    el.innerHTML = `
      ${header}
      <div class="card" style="margin-bottom:1rem"><h3>Kern-Checks (gewichtet, Score-relevant)</h3>${coreRows}</div>
      ${botDetails}
      <div class="two-col" style="margin-bottom:1rem">
        <div class="card"><h3>AI-Dateien (C-7, E-2)</h3>${fileRow}</div>
        <div class="card"><h3>Informelle Checks</h3>${infoRows || '<p style="color:#555;font-size:0.82rem">–</p>'}</div>
      </div>
      ${schemaCard}
      ${snippets}
      ${qaExamples}`
  }

  function renderMobile(r) {
    if (!r.mobile) {
      document.getElementById('tab-mobile').innerHTML = '<p style="color:#555;padding:1rem">Keine Mobile-Daten in diesem Report.</p>'
      return
    }
    const checks = (r.mobile.checks || []).map(c =>
      `<li><span class="${c.pass ? 'dot-green' : 'dot-red'}">${c.pass ? '✓' : '✗'}</span>${escHtml(c.label)}</li>`
    ).join('')
    const pages = (r.mobile.pages || []).map(p => {
      return `<div class="mobile-card">
        ${thumbHtml(p.screenshotPath, 180)}
        <div class="mi">
          <div class="mi-title">${escHtml(p.title || '(kein Titel)')}</div>
          <div class="mi-url">${escHtml(p.url)}</div>
        </div>
      </div>`
    }).join('')

    document.getElementById('tab-mobile').innerHTML = `
      <div class="score-card" style="text-align:center;margin-bottom:1.5rem">
        <div class="val ${scoreClass(r.mobile.score)}">${r.mobile.score}</div>
        <div class="lbl">Mobile-Score</div>
      </div>
      <div class="card" style="margin-bottom:1rem"><h3>Mobile Checks</h3><ul>${checks}</ul></div>
      <div class="card"><h3>Mobile Screenshots</h3><div class="mobile-grid">${pages}</div></div>`
  }

  function showStatus(text, pct) {
    document.getElementById('status-box').style.display = 'block'
    document.getElementById('status-text').textContent = text
    document.getElementById('progress-bar').style.width = pct + '%'
  }
  function hideStatus() {
    document.getElementById('status-box').style.display = 'none'
    document.getElementById('live-pages').innerHTML = ''
  }

  function renderLivePages(pages) {
    const el = document.getElementById('live-pages')
    el.innerHTML = pages.map(p => {
      const statusBadge = p.statusCode === 200
        ? `<span class="badge b-ok">${p.statusCode}</span>`
        : `<span class="badge b-err">${p.statusCode ?? '?'}</span>`
      const msBadge = p.loadTime ? `<span class="badge b-ms">${p.loadTime}ms</span>` : ''
      const jsErrBadge = p.jsErrors?.some(e => e.firstParty)
        ? `<span class="badge b-err">JS ⚠</span>` : ''
      const thumb = p.screenshotPath
        ? `<img src="/${p.screenshotPath}" class="live-thumb" loading="lazy">`
        : `<div class="live-thumb-placeholder"></div>`
      return `<div class="live-page-row">
        ${thumb}
        <div class="live-page-info">
          <div class="live-page-title">${escHtml(p.title || '(kein Titel)')}</div>
          <div class="live-page-url">${escHtml(p.url)}</div>
          <div class="live-page-badges">${statusBadge}${msBadge}${jsErrBadge}</div>
        </div>
      </div>`
    }).join('')
  }
  function showError(msg) {
    const el = document.getElementById('error-box')
    el.textContent = 'Fehler: ' + msg
    el.style.display = 'block'
  }

  // ── E1 — PDF Export ──────────────────────────────────
  async function exportPdf() {
    if (!currentReport) return
    const btn = document.getElementById('btn-pdf')
    btn.textContent = '…'
    btn.disabled = true
    window.open(`/export-pdf/${currentReport.id}`, '_blank')
    setTimeout(() => { btn.textContent = '↓ PDF'; btn.disabled = false }, 2000)
  }

  // ── E2 — Diff-PDF Export ──────────────────────────────
  async function exportDiffPdf() {
    const { idA, idB } = currentDiffIds
    if (!idA || !idB) return
    const btn = document.getElementById('btn-diff-pdf')
    btn.textContent = '…'
    btn.disabled = true
    window.open(`/export-pdf-diff/${idA}/${idB}`, '_blank')
    setTimeout(() => { btn.textContent = '↓ PDF'; btn.disabled = false }, 2000)
  }

  document.getElementById('url-input').addEventListener('keydown', e => { if (e.key === 'Enter') startCheck() })

  fetch('/version').then(r => r.json()).then(({ version, buildDate }) => {
    const built = buildDate
      ? new Date(buildDate).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })
      : null
    document.getElementById('ver').textContent = built ? `v${version} · ${built}` : `v${version}`
    console.log(`%c🩺 Website Doctor v${version}`, 'color:#6c6cff;font-weight:bold;font-size:14px')
  })

  fetchHistory()
  fetchQueue()
</script>
</body>
</html>
