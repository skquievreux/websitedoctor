name: Security Audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` input here — pnpm/action-setup@v4 reads it from
      # package.json's `packageManager` field (pnpm@10.27.0) automatically.
      # Specifying both makes the action refuse to run at all
      # ("Multiple versions of pnpm specified"), even though 10 and
      # 10.27.0 aren't actually in conflict.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run security audit
        run: pnpm audit --audit-level=high
