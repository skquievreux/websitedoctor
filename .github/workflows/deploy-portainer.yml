name: Deploy (Portainer)

# Builds the image, pushes it to our private registry, then triggers the
# Portainer stack's Git webhook. The stack's compose file uses
# `pull_policy: always` and the stack has AutoUpdate.ForcePullImage set, so
# the webhook re-pulls this exact image and restarts the container - no
# build happens on the server itself anymore.
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: registry.runitfast.xyz
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            registry.runitfast.xyz/sitechecker-api:latest
            registry.runitfast.xyz/sitechecker-api:${{ github.sha }}

      - name: Trigger Portainer redeploy
        run: curl -sf -X POST "${{ secrets.PORTAINER_WEBHOOK }}"
